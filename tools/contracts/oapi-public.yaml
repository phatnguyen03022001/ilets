# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: publicopenapi
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output: internal/generated/openapi/public/public.gen.go
compatibility:
  preserve-original-operation-id-casing-in-embedded-spec: true
output-options:
  skip-prune: true
