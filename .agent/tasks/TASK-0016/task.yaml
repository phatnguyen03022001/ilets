structure_authority:
  status: RESOLVED
  source: "Accepted FTR-047..FTR-053 / FLW-005..FLW-006 privileged surface, accepted EXT-001..EXT-004 inventory, canonical design/04-application-flows.md, design/05-api.md, design/06-implementation-stack.md and design/07-third-party-services.md."
  rationale: "TASK-0013 intentionally left only the seven privileged feature external-dependency relations unresolved through UNK-008. Canonical design/07 contains a broader provider inventory than these seven features require, so this task must prove the minimum material external boundaries actually traversed by privileged behavior rather than promote every selected service into the catalog. Existing EXT-001..EXT-004 are reused only where they fully represent the material dependency boundary; additional EXT identities are justified only by distinct selected/TBD external capability boundaries that a privileged feature materially depends on."

objective: "Resolve UNK-008 by mapping FTR-047..FTR-053 to the smallest truthful external-dependency surface, reusing EXT-001..EXT-004 where justified and adding only minimum new EXT identities required by current privileged feature semantics, without activating providers or cataloging the whole third-party inventory."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and resolve FTR-047..FTR-053, FLW-005..FLW-006, EXT-001..EXT-004, current DATA/IFC mappings, and only canonical third-party/runtime sections needed to determine material privileged external crossings."
    - "Preserve EXT-001..EXT-004 identities, meanings, lifecycle boundaries and current learner/evaluator mappings exactly unless canonical truth demonstrates a contradiction; contradiction is a blocker, not permission for silent rewrite."
    - "For each privileged feature, distinguish a material external dependency from Core-owned data/state, public API interface, capability permission, provider telemetry, implementation library, route group or incidental infrastructure. A feature does not depend on every provider used somewhere in its broader flow."
    - "Reuse an existing EXT only when its current boundary fully represents the privileged feature's material external dependency. Do not attach EXT-004 merely because AI exists elsewhere, EXT-003 merely because async work is possible, or EXT-001 merely because the actor authenticated."
    - "Add only the minimum additional EXT identities required by canonical privileged behavior. Candidate concerns such as payment/subscription facts, secret custody, operational observability, object/media storage, transactional email or other selected/TBD routes are cataloged only if a current privileged feature materially crosses that external boundary. Do not create one EXT per provider model alias, endpoint, SDK, dashboard, log stream, storage bucket or optional/deferred service."
    - "Each new EXT identity must be boundary-sized, have a stable semantic dependency meaning, a justified SERVICE or PLATFORM kind, criticality supported by the affected product behavior, and a structural docs/INTERFACES.md doc_ref. Provider lifecycle remains canonical in design/07; catalog identity does not imply ACTIVE."
    - "Update FLW-005/FLW-006 dependency_refs only where the grouped flow materially crosses an external boundary. Pure Core-internal audit reconciliation must not receive provider refs merely because the audited operation used a provider earlier."
    - "Replace each FTR-047..FTR-053 relations.dependencies unresolved_ref UNK-008 with truthful typed refs or demonstrated N/A. Uncertainty is never N/A."
    - "Extend docs/INTERFACES.md only enough to explain newly material external boundaries plus failure/fallback/exit treatment that is materially new for those boundaries. Do not duplicate the entire design/07 provider matrix or mutable model/pricing/quota research."
    - "Resolve UNK-008 only when all seven privileged feature dependency relations and affected grouped-flow dependency_refs are complete. Add dedicated docs/DECISIONS.md#UNK-008 resolution evidence and valid resolved_by_ref attribution."
    - "Do not modify CAP mappings or resolve UNK-009. Preserve accepted DAT/IFC mappings and all existing provider lifecycle truth. Keep milestone.scope_state OPEN."
    - "No provider activation/configuration, credential handling, spend authorization, exact webhook fields/signatures, OpenAPI/DTO materialization, implementation code, workflow, branch creation, staging, main mutation, promotion or release."
    - "Current execution context is phone/ChatGPT+GitHub only. Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "Validate the exact candidate against the pinned agent-documents model. Require zero model/reference/traceability/reachability/orphan defects. Remaining intentional blockers must be limited to OPEN scope plus UNK-009 and its CAP relation states."
    - "Publish one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW."

