acceptance_criteria:
  - id: AC-1
    requirement: "Every privileged FTR-047..FTR-053 has a truthful external-dependency relation using exact EXT refs or demonstrated N/A; no relation remains on UNK-008."
  - id: AC-2
    requirement: "The resulting EXT inventory is the smallest materially complete dependency surface for current privileged behavior; existing boundaries are reused where valid and broader design/07 provider inventory is not mechanically promoted into EXT identities."
  - id: AC-3
    requirement: "FLW-005..FLW-006 dependency_refs reflect actual external crossings; provider identities are not attached to purely Core-internal semantics or merely adjacent audited operations."
  - id: AC-4
    requirement: "UNK-008 is RESOLVED only after complete privileged dependency mapping, with valid resolution evidence and attribution; UNK-009 remains the only downstream DESIGN blocker and milestone remains OPEN."
  - id: AC-5
    requirement: "Pinned-model validation has zero model/reference/traceability/reachability/orphan defects; implementation/report lineage is exact; main and topology remain unchanged."

