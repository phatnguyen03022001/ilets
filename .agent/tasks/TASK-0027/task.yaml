structure_authority:
  status: RESOLVED
  source: "TASK-0026 GAP-001 plus pinned agent-documents V1 shard semantics."
  rationale: "The cutover blocker is not missing product design. The successor authority plane lacks detailed locked learning ontology truth. agent-documents V1 explicitly allows one-level shards within an existing authority domain, so the smallest repair is to preserve the canonical Skill/Knowledge ontology in legal PRODUCT-domain shards rather than inflate root docs, invent a ninth authority domain, or invent unsupported catalog identity classes."

objective: "Preserve the complete locked canonical learning ontology from spec/03-SKILLS.md and spec/04-KNOWLEDGE.md inside the successor agent-documents authority plane using legal one-level PRODUCT shards and authoritative support references, without changing product semantics or performing authority cutover."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and require dev equals the exact handoff base with topology exactly {dev, main}."
    - "Reproduce TASK-0026 GAP-001 before mutation: confirm L-COMP-01 and the broader 67 Skill Leaves plus 46 Knowledge Objects are material canonical truth absent from the successor authority plane."
    - "Use legal one-level PRODUCT authority shards under docs/product/. Do not create a ninth authority domain and do not put the full ontology into docs/PRODUCT.md."
    - "Materialize the complete semantic content currently owned by spec/03-SKILLS.md: all 67 stable Skill Leaf identities, names, skill/component membership, applicable variant distinctions, atomic objectives, and every Skill-to-Skill prerequisite edge. Preserve the canonical atomicity/ownership boundaries and any materially consequential explanatory constraints."
    - "Materialize the complete semantic content currently owned by spec/04-KNOWLEDGE.md: all 46 stable Knowledge Object identities, names, domains, concise definitions, all Knowledge-to-Knowledge prerequisite edges, and the complete Skill-to-Knowledge resolution semantics/edges. Preserve the distinction that Knowledge is enabling language content rather than a fifth IELTS skill."
    - "Prefer two cohesive legal shards: docs/product/skill-leaves.md and docs/product/knowledge-objects.md. Keep each shard directly under docs/product/ with no deeper nesting."
    - "Make the new shards structurally authoritative within the successor PRODUCT domain using the minimum pinned-model-valid catalog coverage/support references. Do not invent catalog identity classes for Skill Leaves or Knowledge Objects because V1 defines no such ID classes."
    - "Update docs/PRODUCT.md only as needed to explain ownership/traceability and point readers to the PRODUCT shards without duplicating the full ontology."
    - "Update docs/catalog/project.json only as needed to authorize/reach the new shards through valid PRODUCT-domain coverage/support references and preserve all existing ACT/ROL/FTR/ACC/SYS/DAT/IFC/FLW/EXT/CAP/DEC/UNK inventories and relations unless a direct pinned-model requirement proves a minimal reference adjustment is necessary."
    - "Treat documentation closure as reopened during the repair. Do not use prior FROZEN/DOCS_READY as proof that the candidate is complete. Because publication is bounded to one implementation commit, no intermediate OPEN remote commit is required; the final candidate may be FROZEN only after semantic parity and pinned-model validation pass."
    - "Perform exact semantic parity checks against both canonical legacy owners. At minimum verify all 67 Skill Leaf IDs, all 46 Knowledge Object IDs, all atomic objectives/definitions, Skill-to-Skill prerequisites, Knowledge-to-Knowledge prerequisites, and Skill-to-Knowledge resolution are preserved with no omission, identity drift or changed learning consequence."
    - "If the pinned agent-documents model cannot make these shards authoritative without changing V1 or inventing unsupported identity classes, make no implementation mutation, report the exact model blocker and stop BLOCKED. Do not modify agent-documents in this task."
    - "If semantic parity is complete, validate the exact successor candidate against agent-documents@acb3f02616e700190586681306a86905792e4c07 and require zero model/reference/coverage/traceability/reachability/orphan/unresolved/blocking defects plus derived DOCS_READY=TRUE."
    - "Preserve the existing operator DESIGN LOCK. This task is authority-representation migration only; it must not revise Skill/Knowledge semantics, add/remove ontology entities, change prerequisites, alter feature behavior, or reopen product design."
    - "Do not perform canonical authority cutover, legacy demotion/deletion/retirement, README precedence change, standards assessment, exact contracts, implementation planning/code, provider activation/configuration, spend authorization, main/staging mutation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "Publish at most one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW. If blocked before implementation, publish only the truthful canonical report and stop BLOCKED."

