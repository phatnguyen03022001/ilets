invariants:
  - "Legacy CONSTITUTION.md, OBJECTIVE.md, spec/** and design/** remain canonical and unchanged."
  - "docs/** remains MIGRATION DRAFT / AUTHORITY NONE."
  - "dev remains the active engineering branch; main is unchanged; staging is not introduced or activated by this task."
  - "No role/entitlement choice may change Band, evidence, mastery/readiness, target, content-quality or Assessment semantics."
  - "No provider is selected/activated and canonical pronunciation/acoustic TBD truth is preserved."
  - "No code, exact API contract, schema, component system, pricing, deployment, workflow, promotion or release mutation."

acceptance_criteria:
  - id: AC-1
    requirement: "The previously FROZEN migration milestone is truthfully reopened to OPEN because material product-experience design work is now admitted before design lock."
  - id: AC-2
    requirement: "PRODUCT clearly distinguishes product participants, authorization bundles and commercial entitlements; the intended five authorization bundles are represented without turning FREE/PRO or AI support into false RBAC roles."
  - id: AC-3
    requirement: "BEHAVIOR provides a compact simple-surface/deep-system learner IA plus bounded admin/BOPS surface semantics and truthful FREE/PRO speaking availability without pixel/UI/provider overreach."
  - id: AC-4
    requirement: "Catalog changes are minimal/model-valid: only justified ACT/ROL/root additions plus one explicit OPEN DESIGN feature-decomposition blocker; existing FTR-001..FTR-006 and accepted SYS/DAT/IFC/EXT/CAP/DEC semantics remain unchanged."
  - id: AC-5
    requirement: "Pinned-model validation has zero structural/reference/traceability/orphan defects; implementation/report lineage is exact; main/topology remain unchanged."

