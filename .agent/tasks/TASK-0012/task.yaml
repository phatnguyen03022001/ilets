structure_authority:
  status: RESOLVED
  source: "Current canonical design/00-learning-experience.md and design/04-application-flows.md, plus the explicit operator product direction captured by this task."
  rationale: "Canonical design already owns the simple-surface/deep-system learner journey, primary navigation, progressive disclosure, entitlement-visible availability, actor classification, capability-based RBAC bundles and learner-entitlement separation. The operator direction expands the current documentation milestone from the six macro behavior anchors toward the full product/UX design required before production implementation."

operator_delta:
  - "The intended product is an ambitious self-directed IELTS system whose learner-facing UI remains simple/modern while the underlying model covers target-band requirements, four skills, micro-skills, vocabulary/grammar/phonology, review, mocks, media and broad repeatable traditional-centre practice patterns. The 95-99% replacement aspiration is a direction, not a current measured coverage claim."
  - "Five authorization bundles are the intended ordinary product model: LEARNER, COLLABORATOR, REVIEWER, ADMIN, OWNER. Learning-support participants such as AI support or optional human expert are not automatically authorization-role bundles."
  - "Commercial entitlement such as FREE/PRO is not an RBAC role and cannot change IELTS/Band/evidence truth."
  - "A browser-microphone learner path may support bounded speaking capture/practice with explicit capability limitations; absent a supported acoustic/pronunciation route it must not claim pronunciation evidence. Eligible PRO entitlement may unlock realtime AI speaking when its provider/capability gates are actually satisfied."
  - "Ordinary supported learning must not require a teacher. AI may perform the ordinary teaching/support workload inside bounded non-authoritative roles."
  - "Learner UX should expose a small surface model over deep semantics; admin/BOPS should expose only operational/product decisions and never bypass Core or learning/evidence authority."

objective: "Reopen the accepted frozen migration baseline for the full product-experience milestone and materialize the minimum PRODUCT + BEHAVIOR foundation for actor/RBAC/entitlement distinctions and learner/admin surface architecture, without yet exploding the six macro FTR anchors into the complete feature/micro-skill inventory."

scope:
  required_changes:
    - "Change docs/catalog/project.json milestone.scope_state from FROZEN back to OPEN because the operator has explicitly expanded/clarified material current-milestone product/UX design before design lock. Do not claim DOCS_READY after reopening."
    - "Extend docs/PRODUCT.md with the minimum current product actor/role/entitlement model. Preserve learner, AI-support and optional-human participation semantics, but distinguish those from authorization bundles. Record LEARNER plus canonical COLLABORATOR/REVIEWER/ADMIN/OWNER default authorization bundles and keep entitlement separate from RBAC."
    - "Where the V1 catalog needs identities for newly material privileged actor/role truth, add only the minimum ACT/ROL records justified by canonical design, with model-valid doc refs and milestone roots as needed for reachability. Do not create an entitlement identity class that V1 does not own."
    - "Extend docs/BEHAVIOR.md with a compact learner-facing surface/experience map derived from canonical design/00: simple default navigation over deep semantics, including Today, Skills, Practice, Review, Media, Progress and Mock plus only justified contextual/secondary surfaces such as Target/Diagnostic, Vocabulary and Profile."
    - "Add a compact privileged/admin/BOPS surface family sufficient to expose content/review/release, user support, entitlement reconciliation, operational/provider/work visibility, approved policy administration, security-sensitive administration and audit according to canonical capability boundaries. Do not design pixel-level UI or duplicate the full RBAC matrix."
    - "Capture entitlement-visible speaking behavior without inventing provider availability: bounded browser-mic practice remains truthful about unsupported pronunciation/acoustic evidence; realtime AI speaking is available only when entitlement plus provider/capability/product-support gates permit it."
    - "Preserve FTR-001..FTR-006 as macro behavior anchors in this task. Do not create the full learner/admin feature inventory yet. Add one OPEN DESIGN blocking unknown for the next feature-decomposition step so the reopened milestone cannot be falsely re-closed before material learner/admin surface capabilities are decomposed and traced."
    - "Keep all docs/** migration artifacts authority NONE and legacy canonical owners unchanged. This task does not perform authority cutover, operator design lock, standards assessment, exact contracts or implementation."
    - "Validate the exact candidate against the pinned agent-documents model. Structural/reference/traceability/orphan defects are not acceptable; OPEN scope plus the explicit feature-decomposition design unknown are intentional blockers."
    - "Publish one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW."

