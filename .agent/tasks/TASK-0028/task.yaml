structure_authority:
  status: RESOLVED
  source: "Explicit operator DESIGN LOCK, accepted TASK-0027 review, TASK-0026 fail-closed lesson, and pinned agent-documents V1."
  rationale: "The next safe operation is not another product redesign. It is a complete residual-authority audit followed by an atomic documentation authority cutover only if every material legacy-owned semantic is already preserved in the successor authority plane. The prior cutover attempt stopped on the first discovered residual; this retry must inspect the complete legacy plane and must not create another serial first-finding loop."

objective: "Exhaustively determine whether any material canonical truth remains solely in legacy spec/** or design/** after TASK-0027; if and only if the residual set is empty, atomically cut canonical documentation authority over to the locked successor docs/** plane while preserving scoped machine-contract authority and distinct CONSTITUTION/OBJECTIVE authority."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and require dev equals the exact handoff base with topology exactly {dev, main}."
    - "Reconfirm the accepted operator DESIGN LOCK remains in force and that no post-lock product-semantic mutation occurred outside authorized representation repairs."
    - "Perform a COMPLETE residual-authority audit across every active canonical file in spec/** and design/** against docs/PRODUCT.md, docs/product/*.md, docs/BEHAVIOR.md, docs/ARCHITECTURE.md, docs/DATA.md, docs/INTERFACES.md, docs/QUALITY.md, docs/DELIVERY.md, docs/DECISIONS.md and docs/catalog/project.json."
    - "Do not stop at the first residual. If any material legacy-only truth remains, enumerate ALL material residuals found in this pass, grouped by legacy owner and successor authority domain, with exact file/section evidence and the missing semantic consequence."
    - "A residual is material only when demoting its legacy owner would lose or materially weaken locked product/system semantics, stable identity/graph meaning, evidence/progression rules, external exam truth, content/coverage semantics, authority/failure semantics, operational safety, or another design-locked consequence. Do not preserve duplicate prose, historical explanation, examples, implementation detail, or redundant wording merely because it exists."
    - "If one or more material residuals exist: make NO authority-cutover implementation mutation, do not partially demote legacy, publish only a truthful BLOCKED report containing the complete residual inventory from this pass, and stop."
    - "If and only if the complete residual audit finds zero material legacy-only truth, perform one coherent atomic documentation authority cutover."
    - "On successful cutover, make the eight docs authority domains, their legal referenced shards, and docs/catalog/project.json the canonical project documentation authority plane under pinned agent-documents V1."
    - "Preserve CONSTITUTION.md and OBJECTIVE.md as higher-precedence canonical authorities only for distinct constitutional/objective truth they still own; do not duplicate their semantics into docs merely to delete them."
    - "Preserve contracts/** as scoped exact machine authority wherever current repository truth already designates a machine-readable contract as authoritative for exact wire/schema details. Documentation cutover must not silently demote exact machine-contract authority or let wire contracts override higher-level product semantics outside their scope."
    - "Update README.md/read-order/precedence wording to expose one unambiguous authority path after cutover: operator input where applicable -> CONSTITUTION -> OBJECTIVE -> canonical docs authority domains/catalog -> scoped exact machine contracts where applicable -> implementation/evidence. Use current repository semantics rather than blindly copying this prose."
    - "Remove successor-only MIGRATION DRAFT / AUTHORITY NONE / NON-CUTOVER wording from canonical docs roots and referenced shards where that wording would become false after cutover."
    - "Demote active authority claims in legacy spec/** and design/** consistently enough that no file continues to claim equal canonical ownership. Prefer minimal header/status/read-order changes; do not broadly rewrite, archive, delete, rename, or relocate legacy content in this task."
    - "Do not delete legacy files. Legacy retirement/deletion remains a separate later audit after successful cutover."
    - "Verify no dual-canonical contradiction remains, no material truth is lost, all docs/catalog references remain valid, milestone remains FROZEN, and pinned agent-documents validation has zero model/reference/coverage/traceability/reachability/orphan/unresolved/blocking defects with derived DOCS_READY=TRUE."
    - "Verify the cutover does not alter locked ACT/ROL/FTR/ACC/SYS/DAT/IFC/FLW/EXT/CAP/DEC/UNK semantics, the 67 Skill Leaves, the 46 Knowledge Objects, provider lifecycle state, coverage/support meaning, or product/system behavior."
    - "Do not perform standards assessment, exact-contract redesign/materialization, implementation planning/code, provider activation/configuration, spend authorization, main/staging mutation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "On successful cutover publish at most one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW. If blocked before implementation, publish only the canonical BLOCKED report."

