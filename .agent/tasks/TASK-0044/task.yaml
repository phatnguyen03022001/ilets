acceptance_criteria:
  - id: AC-1
    requirement: "Listening canonical binding is semantically correct and deterministically materialized."
    evidence_required: >-
      Immutable candidate evidence resolves L-F04, PM-L03, PT-13, L-COMP-02, L-QT-01, IELTS-L-QF-04,
      CTX-LISTENING-SHARED, TRAINING, and NOT_EVIDENCE_CANDIDATE from existing canonical owners with no duplicate semantic
      ownership; no L-QT-02/IELTS-L-QF-01 binding exists; Reading slice payload remains semantically unchanged.
  - id: AC-2
    requirement: "One exact, attributable, integrity-bound Ogg bootstrap asset backs the slice."
    evidence_required: >-
      Immutable candidate/proof records the exact Wikimedia/VOA source identity, public-domain basis, audio/ogg media type,
      54891-byte length, SHA-256 1571524ec4006c5b1b599c14ff46e831461a9a00f374eeffcdfb84364149c765, and a deterministic
      embedded-byte integrity check.
  - id: AC-3
    requirement: "PM-L03 is a real shared Listening Core assignment for both existing IELTS variants."
    evidence_required: >-
      Immutable candidate/proof shows Academic and General Training TargetProfiles assign the same
      listening-bootstrap-completion-001-r1 revision, store/return the explicit target variant, reject unknown/missing variant,
      introduce no SHARED TestVariant, and preserve PM-R03.
  - id: AC-4
    requirement: "Listening material is MEDIA_REFERENCE plus real TEXT completion, not completion cosplay."
    evidence_required: >-
      Immutable candidate/proof shows learner-safe activity material exposes the exact media reference and TEXT contract for
      "Write ONE WORD ONLY." / "Name: ______" without options, transcript, answer, provenance, or validator leakage, while Reading
      SINGLE_SELECTION behavior remains unchanged.
  - id: AC-5
    requirement: "Authenticated audio delivery is exact-reference-bound and fail-closed."
    evidence_required: >-
      Immutable candidate/proof shows the authorized media GET returns exact audio/ogg bytes only for the authenticated owner and
      exact assigned reference; anonymous is 401 and foreign/missing/wrong/non-owned references are 404; no filesystem/Range/media
      framework exists.
  - id: AC-6
    requirement: "Bounded TEXT completion scoring is deterministic and preserves Reading scoring."
    evidence_required: >-
      Immutable candidate/proof shows trim plus case-insensitive exact comparison accepts Marsha/case/outer-whitespace equivalents,
      rejects incorrect text, adds no fuzzy/generalized marking, and preserves selected-value Reading scoring.
  - id: AC-7
    requirement: "Listening training records Observation only."
    evidence_required: >-
      Immutable candidate/proof shows PM-L03 TRAINING persists Attempt/Observation with exact Listening scope and creates zero
      EvidenceFact rows, Assessment results, Progression, Band/readiness/mastery/weakness inference, or planner consequence.
  - id: AC-8
    requirement: "Applicable standards/document obligations are met without ceremony inflation."
    evidence_required: >-
      Immutable candidate/proof satisfies bounded COR-1.2/1.3/2.1, SEC-1.2/2.4, SUP-1.1/2.2/2.3, and ASR-1.1/1.2/2.2/2.3;
      existing FTR-010/IFC-001 ownership remains intact; no catalog identity or maturity/independent-review claim is introduced.
  - id: AC-9
    requirement: "Exact candidate has one authoritative repository proof and reconstructible publication lineage."
    evidence_required: >-
      Candidate is the direct child of revision-4 planning base; sentinel is sentinel-only direct child; GitHub Actions run
      33684727585 attempt 1 checks the exact detached candidate and completes full ./verify successfully; revision-5 execution
      creates no replacement candidate/sentinel/proof; topology remains {dev, main} and main is unchanged.

