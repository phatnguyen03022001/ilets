  - "Do not change docs/catalog/project.json, create new catalog identities, or redesign the eight documentation authority domains."
  - "Do not claim agent-standards maturity level, Level-4/5 assurance, independent review, or independent reproduction from TASK-0044."
  - "Do not mutate agent-skills, agent-standards, agent-documents, architect-profile, main, workflows, dependencies, deployment, tags, releases, PRs, issues, or repository metadata."
  - "Do not use GitHub Actions as an iterative debugger; exactly one fresh authoritative run is allowed after narrower verification stabilizes the candidate."

