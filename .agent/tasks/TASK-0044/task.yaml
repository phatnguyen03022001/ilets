structure_authority:
  status: RESOLVED
  source: "Operator-approved corrected TASK-0044 design plus accepted TASK-0043 state"
  rationale: >-
    The first real Listening slice must be executable rather than a descriptor-only trace. The corrected semantic binding is
    L-F04 -> PM-L03 -> PT-13 -> L-COMP-02 + L-QT-01 -> IELTS-L-QF-04 -> CTX-LISTENING-SHARED -> TRAINING ->
    NOT_EVIDENCE_CANDIDATE. Existing OpenAPI already supports MEDIA_REFERENCE stimuli and TEXT responses, so the smallest
    vertical slice is to materialize one owned/vendor-licensed short Ogg asset, one bounded Core assignment path, authenticated
    activity-scoped media delivery, one deterministic text-completion scorer, and a normal Observation. No new schema family,
    provider abstraction, object-storage route, Planner behavior, Assessment admission, Progression rule, or Web UI is required.
    agent-documents does not justify a new catalog identity because FTR-010 and IFC-001 already own this behavior/interface;
    agent-standards does not justify a separate pre-task assessor because this bounded training slice makes no highest-consequence
    Level-4/5 assurance claim. Its applicable lower-level engineering obligations are embedded directly in the acceptance evidence.
    PM-L03 remains owned by docs/behavior/practice-and-media.md. If the accepted materializer cannot uniquely select PM-L03 from
    the broad practice-mode registry because descendant canonical-anchor tables are parsed into the same section, execution may add
    the smallest dedicated PM-L03 materializer anchor inside that existing owner and route source-map selection to it. This changes
    machine resolvability only, not semantic ownership or product meaning, and does not authorize materializer refactoring or a
    duplicate PM-L03 owner elsewhere.

objective: >-
  Materialize the first executable bounded Listening Core/API training slice using the already-canonical Detail & Completion
  semantics. Assign the same immutable Listening ContentRevision under either Academic or General Training TargetProfile,
  deliver its exact embedded Ogg bytes only through the authenticated learner-owned PracticeActivity media reference, accept a
  real TEXT completion response, score it deterministically, and persist an Observation while creating no EvidenceFact.
  Preserve the accepted Reading path and stop before Planner, Assessment, Progression, Web, external storage, TTS/provider
  integration, or generic media infrastructure.

execution_routing:
  operator_environment: "Phone-first operator; ChatGPT + GitHub available. Native repository execution may use Codex. Agent Runtime is not assumed."
  primary_surface: "Codex"
  codex:
    permitted: true
    model: "Luna"
    effort: "xhigh"
    reason: >-
      TASK-0044 requires exact binary vendoring, Go embed/build/test execution, migration/sqlc/OpenAPI generation, repository-pinned
      formatting, and full repository verification. These are materially repository-native operations rather than GitHub-only text edits.
  agent_runtime:
    permitted: false
    reason: "Do not depend on Agent Runtime availability for this program."

scope:
  required_changes:
    - >-
      Require live dev HEAD to equal the exact TASK-0044 handoff base and topology exactly {dev, main} before mutation. Resolve
      the pinned agent-skills revision and the read-only agent-documents v1.0.0 / agent-standards v1.0.0 revisions above before execution.
    - >-
      Under FTR-010 in docs/BEHAVIOR.md, add one dedicated canonical materializer anchor containing exactly one L-F04 markdown-table
      row that faithfully restates the existing Detail & Completion semantics. Do not change FTR-010 product meaning.
    - >-
      Extend tools/canonical/source-map.json only enough to materialize L-F04, PM-L03, L-COMP-02, L-QT-01,
      IELTS-L-QF-04, and CTX-LISTENING-SHARED. Reuse the already-materialized PT-13, TRAINING, and
      NOT_EVIDENCE_CANDIDATE identities. PM-L03 remains owned by docs/behavior/practice-and-media.md. If its existing broad
      practice-mode registry is not uniquely machine-resolvable by the accepted materializer because descendant anchor tables are
      included in the parsed section, add the smallest dedicated PM-L03 materializer anchor in that same canonical owner and point
      source-map at it. Do not duplicate PM-L03 ownership in docs/BEHAVIOR.md and do not modify materialize.py for this condition.
    - >-
      Add tools/slice/listening-detail-completion.json as one bounded implementation descriptor with exact semantic binding:
      L-F04, PM-L03, PT-13, L-COMP-02, L-QT-01, IELTS-L-QF-04, CTX-LISTENING-SHARED, TRAINING,
      NOT_EVIDENCE_CANDIDATE, runtime owner services/core-api, and content revision listening-bootstrap-completion-001-r1.
      The generalized materializer must generate tools/slice/generated/listening-detail-completion-trace.json automatically.
    - >-
      Preserve tools/canonical/materialize.py unchanged unless a separate concrete defect in the already-accepted TASK-0043
      multi-slice behavior is reproduced after the canonical-owner-local PM-L03 selector correction. A desire to refactor,
      generalize, or improve style is not authority to modify it.
    - >-
      Add exactly one Listening bootstrap ContentRevision fixture at
      services/core-api/internal/bootstrap/listening-training-001.json with content_id listening-bootstrap-completion-001 and
      revision_id listening-bootstrap-completion-001-r1. It is shared Listening content, not a third TestVariant: represent
      applicability to the existing exact Academic and General Training values without inventing SHARED as a TestVariant.
    - >-
      The Listening fixture must contain one bounded completion item whose learner instruction is "Write ONE WORD ONLY." and
      whose visible completion prompt is "Name: ______". Its hidden canonical answer is "Marsha". Bind the item to
      IELTS-L-QF-04 and the exact slice scope above. It must not expose answer, transcript, validator instructions, or provenance
      through the learner-safe activity projection.
    - >-
      Vendor exactly the short Ogg source identified by Wikimedia Commons as "Hello. This is Marsha. - Yes, Marsha.ogg" and
      attributed there to VOA Learning English under the Commons/VOA public-domain basis. Before vendoring, re-resolve the live
      Commons source page and fail closed if the source identity, rights basis, or downloadable Ogg cannot be established.
      Do not silently substitute another recording or generated TTS.
    - >-
      Store source-page identity, upstream title/provider attribution, rights/public-domain basis, media type audio/ogg, exact
      vendored byte length, and SHA-256 of the exact vendored Ogg in immutable bootstrap provenance. Add a deterministic test
      proving the embedded bytes match that recorded SHA-256. This satisfies the bounded SUP/ASR provenance requirement for
      this task without building a generic asset provenance system.
    - >-
      Embed the exact vendored Ogg with Go //go:embed through the smallest Core-local implementation. Do not use filesystem
      deployment lookup, R2, signed URLs, provider adapters, a media service, asset registry framework, Range support, transcoding,
      or streaming infrastructure for this 3.9-second bootstrap asset.
    - >-
      Extend the exact public OpenAPI with GET /v1/practice-activities/{practice_activity_id}/media/{media_reference}, using the
      existing naming and learner-owned PracticeActivity boundary. Successful response is exact embedded bytes with Content-Type
      audio/ogg. Anonymous access returns 401. Missing/foreign activity, wrong media_reference, or a reference that is not owned
      by the assigned ContentRevision fails closed as 404. media_reference is an opaque exact resource reference, never a filesystem path.
    - >-
      Regenerate repository-native public Go and TypeScript bindings from the exact OpenAPI. No Web component, route, hook,
      playback UI, or learner-facing browser behavior may be added. The generated TypeScript diff is contract derivation only.
    - >-
      Add PM-L03 Detail & Completion to the existing stable practice-mode API projection and allow direct PracticeActivity
      creation for exactly PM-L03 in addition to the existing PM-R03 path. Preserve PM-R03 behavior and rejection semantics.
    - >-
      PM-L03 assignment requires a TargetProfile whose test variant is explicitly PRESENT and exactly Academic or General
      Training. Unknown/missing variant is rejected; do not invent a default. The same listening-bootstrap-completion-001-r1
      ContentRevision is used for both variants.
    - >-
      Add the next migration only as needed to widen practice_activities.test_variant from its current Academic-only constraint
      to exactly the existing DB values ACADEMIC | GENERAL_TRAINING. Store the current TargetProfile variant on the assigned
      PracticeActivity. Do not add SHARED, a third variant, a media table, or another persistence abstraction.
    - >-
      Add only the bounded SQL/query support needed to select the eligible PM-L03 Listening bootstrap revision, create a
      learner-owned PM-L03 PracticeActivity with the explicit target variant, and reload that stored variant with the activity.
      Preserve the current PM-R03 Reading SQL path and exact-revision Reading assessment paths.
    - >-
      Extend bootstrap seed defaults and validation only enough to admit the new Listening fixture while preserving all current
      Reading fixture validation. Listening TEXT completion validation must reject malformed family/scope, missing prompt/answer,
      choices-based cosplay, extra/missing executable item structure outside the bounded fixture contract, and unknown canonical refs.
    - >-
      Materialize the already-existing OpenAPI TEXT response capability for the Listening item. Learner projection must expose a
      MEDIA_REFERENCE stimulus and a TEXT response contract; it must not convert the completion into SINGLE_SELECTION or expose
      answer options. Preserve existing Reading TEXT stimulus + SINGLE_SELECTION projection byte/behavior semantics where applicable.
    - >-
      Extend attempt response parsing/scoring with one bounded deterministic completion policy: trim surrounding whitespace and
      compare case-insensitively against the exact canonical answer. Do not add fuzzy matching, stemming, punctuation heuristics,
      edit distance, synonym acceptance, generalized IELTS marking, or provider/model evaluation. Existing selected-value Reading
      scoring remains unchanged.
    - >-
      A valid PM-L03 TRAINING submission must continue through the normal Attempt -> Observation path with scoring_method
      deterministic/keyed as appropriate and exact Listening scope. It must never create an EvidenceFact, Assessment result,
      Mastery/Readiness/Band inference, GapEvaluation, or Progression consequence.
    - >-
      Add focused Core integration evidence proving both Academic and General Training TargetProfiles can assign the same immutable
      Listening revision; the returned PracticeActivity reports the stored current target variant; its learner material contains
      MEDIA_REFERENCE + TEXT completion; media delivery returns exact audio/ogg bytes; anonymous access is 401; foreign learner,
      wrong ref, and missing resource are 404; valid "Marsha", case variants, and surrounding-whitespace variants score correct;
      an incorrect text scores incorrect; an Observation is persisted; no EvidenceFact is persisted.
    - >-
      Preserve current Reading PM-R03 direct training as a regression oracle, including assignment, learner-safe material,
      selected-value scoring, Observation behavior, and existing Reading integration/E2E expectations.
    - >-
      Apply agent-standards v1.0.0 only as task-level evidence obligations, not maturity certification: COR-1.2/COR-1.3/COR-2.1
      for positive/negative/boundary behavior; SEC-1.2/SEC-2.4 for authenticated activity-scoped media fail-closed access;
      SUP-1.1/SUP-2.2/SUP-2.3 for vendored Ogg source identity and integrity; ASR-1.1/ASR-1.2/ASR-2.2/ASR-2.3 for exact-revision
      evidence, external-source attribution, repeatability, and unresolved-evidence fail-closed behavior. Do not claim Level 4/5,
      independent review, independent reproduction, or repository-wide maturity from this task.
    - >-
      Apply agent-documents v1.0.0 only as ownership/closure discipline. FTR-010 remains the feature identity and IFC-001 remains
      the public product API identity. Do not modify docs/catalog/project.json or invent a new feature/interface/data identity for
      this bounded route or embedded asset. If execution discovers that a genuinely new authority identity is required, stop with
      AUTHORITY_REQUIRED rather than silently expanding the catalog.
    - >-
      Construct one exact implementation candidate from the handoff base. Run focused materializer, Go, DB/migration, OpenAPI,
      generated-code, and integration verification plus repository-native ./verify locally/native through Codex when feasible.
      After the candidate is stable, create exactly one sentinel-only direct child and require exactly one fresh GitHub Actions
      full ./verify PASS bound to the exact detached candidate. Publish report.yaml only after PASS, then stop at NEEDS_REVIEW.

  allowed_existing_files_or_components:
    - .agent/tasks/TASK-0044/task.yaml
    - docs/BEHAVIOR.md
    - docs/behavior/practice-and-media.md
    - tools/canonical/source-map.json
