  - "No L-QT-02 or IELTS-L-QF-01 binding is introduced by the Listening slice."
  - "The Listening ContentRevision is one shared immutable revision reused for Academic and General Training; SHARED is not a TestVariant value."
  - "The assigned PracticeActivity stores the explicit current TargetProfile variant as ACADEMIC or GENERAL_TRAINING."
  - "The learner-facing Listening item is a real TEXT completion, never a choice-list simulation."
  - "Media access is authenticated, activity-owned, exact-reference-bound, and fail-closed; the media reference is never interpreted as a filesystem path."
  - "The vendored Ogg is exact, provenance-attributed, SHA-256-bound, and delivered with Content-Type audio/ogg."
  - "No Range handling, media service, R2, TTS, provider abstraction, generated-audio path, or storage abstraction is introduced."
  - "TRAINING produces an Observation only; no EvidenceFact admission or broader learner-state inference occurs."
  - "PM-R03 Reading behavior and existing Reading generated slice payload remain semantically unchanged. Canonical source revision/hash metadata may update deterministically because the source map/global registry gains Listening authority."
  - "PM-L03 remains canonically owned by docs/behavior/practice-and-media.md; any dedicated materializer anchor is a machine-resolution aid inside that owner, not a new semantic owner."
  - "No Planner, Assessment, Progression, Web behavior, external provider activation, deployment, main, release, branch topology, workflow, or repository metadata change."
  - "agent-documents and agent-standards remain read-only external authorities; this task mutates only ilets/dev."

