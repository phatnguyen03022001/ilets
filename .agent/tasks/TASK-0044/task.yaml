acceptance_criteria:
  - id: AC-1
    requirement: "Listening canonical binding is semantically correct and deterministically materialized."
    evidence_required: >-
      Exact source-map/registry/trace evidence resolves L-F04, PM-L03, PT-13, L-COMP-02, L-QT-01, IELTS-L-QF-04,
      CTX-LISTENING-SHARED, TRAINING, and NOT_EVIDENCE_CANDIDATE from canonical docs. PM-L03 remains sourced from
      docs/behavior/practice-and-media.md with no duplicate semantic owner. No L-QT-02/IELTS-L-QF-01 binding exists.
      reading-training slice payload remains unchanged.
  - id: AC-2
    requirement: "One exact, attributable, integrity-bound Ogg bootstrap asset backs the slice."
    evidence_required: >-
      The candidate contains exactly the authorized Ogg asset; immutable fixture provenance records the live-resolved Commons
      source identity, VOA attribution/public-domain basis, byte length, MIME type, and SHA-256; a deterministic test recomputes
      the embedded bytes SHA-256 and matches provenance. No provider/storage abstraction is introduced.
  - id: AC-3
    requirement: "PM-L03 is a real shared Listening Core assignment for both existing IELTS variants."
    evidence_required: >-
      Focused DB/Core tests prove an Academic TargetProfile and a General Training TargetProfile each assign the same
      listening-bootstrap-completion-001-r1 revision through PM-L03, while PracticeActivity stores and returns the explicit
      corresponding target variant. Unknown/missing variant fails without defaulting. PM-R03 regression passes.
  - id: AC-4
    requirement: "Listening material is MEDIA_REFERENCE plus real TEXT completion, not completion cosplay."
    evidence_required: >-
      Learner-safe assigned activity exposes the exact media reference and a TEXT response contract for "Name: ______" /
      "Write ONE WORD ONLY." with no options, transcript, answer, provenance, or validator leakage. Existing Reading
      SINGLE_SELECTION material remains behaviorally unchanged.
  - id: AC-5
    requirement: "Authenticated audio delivery is exact-reference-bound and fail-closed."
    evidence_required: >-
      GET /v1/practice-activities/{practice_activity_id}/media/{media_reference} returns exact embedded bytes with audio/ogg only
      for the authenticated owner and exact assigned revision reference. Anonymous is 401; foreign learner, missing activity,
      wrong ref, and non-owned ref are 404. No filesystem interpretation or Range/media framework exists.
  - id: AC-6
    requirement: "Bounded TEXT completion scoring is deterministic and preserves Reading scoring."
    evidence_required: >-
      Focused tests prove trim + case-insensitive exact comparison accepts Marsha/case/outer-whitespace equivalents and rejects
      incorrect text, with no fuzzy/generalized marking. Existing selected-value Reading scoring tests remain PASS.
  - id: AC-7
    requirement: "Listening training records Observation only."
    evidence_required: >-
      Submission persists the normal Attempt/Observation result with exact Listening content/skill/family/context scope and
      creates zero EvidenceFact rows. No Assessment, Progression, Band/readiness/mastery/weakness or planner consequence is added.
  - id: AC-8
    requirement: "Applicable standards/document obligations are met without ceremony inflation."
    evidence_required: >-
      Exact task/candidate evidence demonstrates COR-1.2/1.3/2.1, SEC-1.2/2.4, SUP-1.1/2.2/2.3, and
      ASR-1.1/1.2/2.2/2.3 at the bounded task scope. Target documentation continues to route through existing FTR-010/IFC-001
      ownership with no project catalog identity changes. No maturity or independent-review claim is made.
  - id: AC-9
    requirement: "Exact candidate receives one authoritative repository proof and reconstructible publication lineage."
    evidence_required: >-
      Candidate is a direct child of the exact handoff base; focused/native verification is stable; one sentinel-only direct
      child binds that candidate; exactly one fresh GitHub Actions run checks out the exact candidate detached and completes full
      ./verify PASS; report is report-only after PASS; topology remains exactly {dev, main} and main is unchanged.

