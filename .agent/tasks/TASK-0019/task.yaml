structure_authority:
  status: RESOLVED
  source: "TASK-0018 GAP-001 plus accepted TASK-0013..TASK-0017 relation-domain state."
  rationale: "TASK-0018 proved a false-closure blocker caused by stale migration prose: catalog relations and UNK-001..UNK-009 are resolved, while several authority-NONE docs still describe those exact relation domains/unknowns as unresolved. The fix is state reconciliation only, not product redesign or scope freeze."

objective: "Reconcile stale migration closure-state assertions with the already-accepted resolved relation/unknown state, without changing product semantics, identities, relations, milestone scope_state, legacy authority, or downstream lifecycle authority."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and resolve TASK-0018 GAP-001 evidence before editing."
    - "Correct only stale migration-state prose that still claims already-resolved DATA/IFC/EXT/CAP relation work or UNK-001..UNK-009 remains OPEN/incomplete."
    - "At minimum inspect and reconcile the GAP-001 locations in docs/PRODUCT.md, docs/BEHAVIOR.md, docs/DATA.md, docs/QUALITY.md, docs/DELIVERY.md and docs/DECISIONS.md."
    - "Where text explains why milestone scope is OPEN, update it truthfully: relation/unknown work is resolved; scope remains OPEN only because the post-reconciliation semantic closure/freeze audit has not yet passed."
    - "Preserve all product/domain semantics, actor/role/entitlement definitions, FTR/FLW/ACC behavior, SYS/DAT/IFC/EXT/CAP/DEC identities and relations, provider lifecycle, quality/delivery requirements, and canonical legacy truth."
    - "Do not change docs/catalog/project.json milestone.scope_state; it must remain OPEN in this task. Do not claim DOCS_READY."
    - "Do not add new features, unknowns, relation identities, providers, capabilities, decisions or deeper design merely to improve wording. If reconciliation exposes a genuinely new material contradiction rather than stale wording, stop BLOCKED and report it instead of redesigning."
    - "Validate the exact candidate against the pinned agent-documents model/reference/reachability semantics and independently confirm no stale assertion remains that contradicts resolved UNK-001..UNK-009/current typed relations."
    - "Do not perform closure freeze, DESIGN LOCK, authority cutover, legacy retirement, standards assessment, exact contracts, implementation planning/code, provider activation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "Publish one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW."

