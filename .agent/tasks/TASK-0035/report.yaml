  classification_case: 2
  classification: PLAYWRIGHT_EXPECTATION_STALE_OR_OVER_SPECIFIC
  implementation_defect: false
  canonical_authority_ambiguous_or_contradictory: false
  rationale: >-
    Current canonical behavior requires truthful bounded evidence handling, no fabricated learner-state
    consequence, and a visible blocker/no eligible recommendation when the supported route cannot derive
    a justified next action. It does not canonize the stale Playwright sentence. Current runtime already
    preserves the admitted sampled EvidenceFact without inventing GapEvaluation, ActionIntent, Band,
    readiness, pass state, or target completion; Planner exposes a structured TRANSITION/BLOCKED
    CoverageGap, and Today renders its learner-facing blocking_consequence while withholding a next
    recommendation. The failing E2E was therefore coupled to incidental copy rather than the semantic state.
  canonical_evidence:
    - path: docs/BEHAVIOR.md
      evidence: >-
        FTR-005 and the behavior invariants require claim-scoped evidence admission and only justified
        Progression consequences; failure behavior requires truthful blockers and forbids converting
        product inability or missing evidence into learner weakness. ACC-010 forbids feature completion
        from independently creating Band, mastery/readiness, or next-action truth.
    - path: docs/DATA.md
      evidence: >-
        EvidenceFact is distinct from ReadinessEvaluation, GapEvaluation, and BandCertificationState;
        ActionIntent is a Progression output; CoverageGap represents product inability or unresolved
        support and remains categorically separate from learner GapEvaluation.
    - path: docs/behavior/planner-and-lifecycle.md
      evidence: >-
        Planner stage 3 consumes Assessment/Progression outputs without reinterpreting them; ordinary
        assessment flow advances Progression only when justified; when no eligible route exists the
        product exposes a truthful gap rather than relaxing semantics.
  runtime_evidence:
    - path: services/core-api/internal/progression/sampled_reading.go
      evidence: >-
        An admitted sampled AT-02 EvidenceFact maps to NO_AUTHORIZED_NEXT_CONSEQUENCE with no
        GapEvaluation or ActionIntent.
    - path: services/core-api/internal/planner/kernel.go
      evidence: >-
        NO_AUTHORIZED_NEXT_CONSEQUENCE maps to ProgressionTransitionGap without introducing a new
        Progression/ActionIntent transition.
    - path: services/core-api/internal/httpapi/planner.go
      evidence: >-
        ProgressionTransitionGap becomes a structured CoverageGap with gap_class TRANSITION,
        condition_status BLOCKED, no DailyPlan item, and a learner-facing blocking_consequence.
    - path: apps/web/src/features/today/today.tsx
      evidence: >-
        Today refetches DailyPlan after submission, renders CoverageGap blocking_consequence,
        and renders no Recommended next card when the post-submission plan has no item.
  test_evidence:
