objective: >-
  Replace the bounded Academic Reading AT-02 post-evidence Progression dead-end with a truthful
  coverage-based INSUFFICIENT_EVIDENCE -> EVIDENCE_GAP -> COLLECT_EVIDENCE consequence, so the
  existing Planner advances to its already-defined fresh-sample content/supply gap rather than a
  progression_transition blocker, without inferring learner ability, mastery, Band, readiness,
  or inventing score, calibration, confidence, quantity, recency, or evidence thresholds.

scope:
  required_changes:
    - "Refresh exact refs/topology/task and require dev equals the exact handoff base with topology exactly {dev, main}."
    - "Preserve Assessment sampled-reading interpretation exactly as bounded evidence admission: AT-02, Academic, canonical targets R-QT-02/R-QT-03, BroaderClaimEvaluated=false."
    - "For EVIDENCE_MISSING, preserve the existing NEEDS_EVIDENCE + EVIDENCE_GAP + COLLECT_EVIDENCE consequence."
    - "For SAMPLED_EVIDENCE_RECORDED, replace NO_AUTHORIZED_NEXT_CONSEQUENCE with a distinct explainable post-recorded state meaning more evidence is required, carrying EVIDENCE_GAP + COLLECT_EVIDENCE. Prefer the stable name NEEDS_MORE_EVIDENCE unless an equivalent narrower name is required by existing conventions."
    - "Ground that consequence only in demonstrably incomplete construct coverage: the admitted sample covers R-QT-02/R-QT-03 while the canonical Reading construct contains additional required Reading capability scope. Do not evaluate or fabricate a broader Band/readiness threshold."
    - "Make the lower-bound rule explicit in canonical docs: when a broader consequential claim is known to require construct coverage that the admitted evidence does not cover, missing required coverage is sufficient to classify current evaluation as INSUFFICIENT_EVIDENCE even if threshold/support evaluation remains unresolved. This does not complete the EvidenceRequirement and does not imply learner weakness."
    - "Preserve Planner production logic. With prior sampled assignment and the new COLLECT_EVIDENCE consequence, existing Planner behavior must resolve to FreshSampleContentGap/content supply rather than ProgressionTransitionGap."
    - "Update focused unit/integration/Web tests to prove the post-submission route refetches to the existing fresh eligible sampled Reading content blocker and no longer exposes or depends on progression_transition."
    - "Preserve learner-safe presentation: do not claim evidence admitted as a learner-facing achievement, Band improvement, mastery, readiness, weakness, remediation need, or support. Internal gap/condition identifiers remain hidden from normal learner copy."
    - "Publish exactly one semantic implementation candidate, then exactly one sentinel-only verification-boundary child changing .github/verification-boundary/candidate to that candidate SHA."
    - "Require repository-native GitHub Actions verify to bind the exact immutable candidate, checkout it detached, assert exact HEAD, and complete ./verify PASS."
    - "Only after authoritative PASS publish exactly one report-only child at .agent/tasks/TASK-0041/report.yaml and stop at NEEDS_REVIEW."

  forbidden_changes:
    - "Do not add or modify assessment/content bootstrap fixtures, seed supply, canonical Skill Leaf IDs, official family IDs, Practice Modes, or content inventory."
    - "Do not add R-QT-01/R-QT-04/R-QT-05/R-QT-06 or any other fresh assessment supply in this task."
    - "Do not modify services/core-api/internal/assessment/interpretation.go or broaden Assessment inference."
    - "Do not modify services/core-api/internal/planner/kernel.go or redesign Planner ranking, candidate generation, load, or assignment semantics."
    - "Do not introduce NOT_YET_SUPPORTED, ABILITY_GAP, REMEDIATE, SUPPORTED, CONSOLIDATE, ADVANCE, BandCertificationState changes, mastery support, Band score inference, readiness certification, or target readiness from this sampled evidence."
    - "Do not create a full per-skill Band EvidenceRequirement, numeric score conversion, threshold, attempt count, confidence cutoff, calibration rule, recency window, or diversity formula."
    - "Do not modify public API schemas/contracts, generated API bindings, database schema/migrations/queries, auth, providers, CONSTITUTION.md, OBJECTIVE.md, docs/catalog/project.json, repository topology, main, tags, releases, or deployment."
    - "Do not perform unrelated cleanup, legacy subtraction, formatting sweeps, validator/workflow redesign, or framework expansion."

