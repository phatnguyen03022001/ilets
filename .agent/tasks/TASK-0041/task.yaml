invariants:
  - "The current admitted sample remains claim-scoped to AT-02 Academic R-QT-02/R-QT-03 and never becomes a whole-Reading or Band/readiness claim."
  - "Missing required construct coverage is uncertainty/insufficiency, not negative learner evidence."
  - "The only authorized learner consequence added by this task is EVIDENCE_GAP -> COLLECT_EVIDENCE."
  - "Existing Planner production semantics remain unchanged; the next blocker after prior sampled assignment is truthful fresh content/supply availability."
  - "No new content supply is created, so TASK-0041 may legitimately terminate the product route at the existing FreshSampleContentGap after closing the Progression dead-end."
  - "No main mutation, promotion, release, branch creation, PR creation, or repository metadata mutation."

acceptance_criteria:
  - id: AC-1
    requirement: "EVIDENCE_MISSING still produces NEEDS_EVIDENCE, EVIDENCE_GAP, and COLLECT_EVIDENCE with no semantic regression."
  - id: AC-2
    requirement: "SAMPLED_EVIDENCE_RECORDED produces a distinct post-recorded needs-more-evidence state plus EVIDENCE_GAP and COLLECT_EVIDENCE, while Assessment remains BroaderClaimEvaluated=false and no ability/Band/readiness/support inference is introduced."
  - id: AC-3
    requirement: "The consequence is justified only by incomplete canonical Reading construct coverage; canonical docs explicitly preserve this as a lower-bound INSUFFICIENT_EVIDENCE result and state that the broader EvidenceRequirement/threshold evaluation remains unresolved."
  - id: AC-4
    requirement: "Without modifying planner/kernel.go, existing Planner unit/integration behavior routes a prior sampled assignment with COLLECT_EVIDENCE to FreshSampleContentGap/content_assets and no longer to ProgressionTransitionGap/progression_transition."
  - id: AC-5
    requirement: "The Web Today post-submission test proves plan refetch and learner-safe fresh-content blocker presentation without learner-facing evidence-admission, Band-improvement, mastery/readiness, weakness/remediation, or internal progression_transition terminology."
  - id: AC-6
    requirement: "The semantic candidate changes only the authorized files, adds no content supply/API/DB surface, and repository-native ./verify PASSes on the exact immutable candidate through one valid sentinel-only verification boundary."

