structure_authority:
  status: RESOLVED
  source: "Accepted TASK-0013..TASK-0021 migration state plus current canonical legacy owners and pinned agent-documents closure semantics."
  rationale: "All migration unknowns and typed relation domains are resolved. TASK-0019 reconciled stale closure-state prose across PRODUCT/BEHAVIOR/DATA/QUALITY/DELIVERY/DECISIONS; TASK-0021 reconciled the remaining stale ARCHITECTURE interface-state assertion. The milestone remains OPEN solely pending a fresh independent semantic closure audit."

objective: "Re-run the bounded documentation-closure audit after all identified stale migration-state assertions are reconciled and freeze scope only if the complete migration faithfully covers current canonical legacy truth without material blocker."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and independently compare the complete docs/** migration plus catalog against all current canonical CONSTITUTION.md, OBJECTIVE.md, spec/** and design/** material truth."
    - "Audit for material omission, contradiction, stale assumption, authority drift, false N/A, actor/role/entitlement drift, feature/flow/data/interface/dependency/capability mismatch, unresolved provider/product-support semantics or false closure."
    - "Treat exact machine-contract materialization as a later implementation boundary, not evidence that the semantic INTERFACES migration remains unresolved."
    - "Do not expand product design merely because more detail could be written; apply broad-by-default, deep-by-evidence closure semantics."
    - "If any material gap remains, keep milestone.scope_state OPEN, make no neighboring semantic patch, publish the exact blocker and stop BLOCKED."
    - "Only if the semantic audit passes, change docs/catalog/project.json milestone.scope_state from OPEN to FROZEN and make no unrelated semantic edit."
    - "Validate the exact frozen candidate against the pinned agent-documents model. Require zero model/reference/traceability/reachability/orphan/unresolved/blocking defects and derived DOCS_READY=TRUE."
    - "Do not perform operator DESIGN LOCK, authority cutover, legacy retirement, standards assessment, exact machine-contract materialization, implementation planning/code, provider activation, staging/main mutation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "Publish at most one bounded implementation commit non-force to dev when freeze is justified, then one separate report-only child and stop at NEEDS_REVIEW. If blocked before implementation, publish only the truthful canonical report and stop BLOCKED."

structure_policy:
  expected_new_files:
    - .agent/tasks/TASK-0022/report.yaml
  allowed_existing_files:
    - docs/catalog/project.json
    - .agent/tasks/TASK-0022/task.yaml
  unlisted_new_files:
