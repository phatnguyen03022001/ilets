    max: 0
  allow_new_top_level_directories: false

invariants:
  - "Legacy CONSTITUTION.md, OBJECTIVE.md, spec/** and design/** remain canonical and unchanged."
  - "docs/** remains MIGRATION DRAFT / AUTHORITY NONE."
  - "All ACT/ROL/FTR/ACC/FLW/SYS/DAT/IFC/EXT/CAP/DEC identities and relations remain unchanged."
  - "UNK-001..UNK-009 remain RESOLVED."
  - "No design lock, cutover, standards PASS, exact contracts, code, schema, provider activation, staging/main mutation, promotion or release."

acceptance_criteria:
  - id: AC-1
    requirement: "Independent semantic closure audit finds no material omission, contradiction, stale assumption, authority drift or false closure across the complete migration versus current canonical legacy truth."
  - id: AC-2
    requirement: "If and only if AC-1 passes, milestone.scope_state changes OPEN→FROZEN with no unrelated semantic mutation."
  - id: AC-3
    requirement: "Pinned-model validation of the frozen candidate has zero model/reference/traceability/reachability/orphan/unresolved/blocking defects and derives DOCS_READY=TRUE."
  - id: AC-4
    requirement: "Legacy authority remains unchanged and docs/** remains authority NONE; no design lock or cutover is implied by DOCS_READY."
  - id: AC-5
    requirement: "Implementation/report lineage is exact when implementation occurs; main and topology remain unchanged."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh exact refs/topology/task/pins; require dev equals exact handoff base and topology exactly {dev, main}."
      required: true
    - id: CHECK-2
      command_or_check: "Independently compare complete migrated docs/catalog against all material canonical legacy truth and identify any material closure blocker rather than trusting prior task labels."
      required: true
    - id: CHECK-3
      command_or_check: "Only if closure audit passes, change scope_state OPEN→FROZEN and nothing else semantically."
      required: true
    - id: CHECK-4
      command_or_check: "Run pinned-model closure validation and require derived DOCS_READY=TRUE only for a valid frozen blocker-free candidate."
      required: true
    - id: CHECK-5
      command_or_check: "Refresh stale state, publish bounded implementation if justified plus separate report-only child, verify final refs/topology, stop NEEDS_REVIEW; otherwise report BLOCKED truthfully."
      required: true
  authoritative_verification:
