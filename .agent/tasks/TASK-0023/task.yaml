structure_authority:
  status: RESOLVED
  source: "TASK-0022 GAP-001 plus accepted TASK-0013..TASK-0021 migration state and current canonical legacy owners."
  rationale: "The remaining blocker is not a new product/design ambiguity. PRODUCT, DATA and ARCHITECTURE encode transient present-tense OPEN milestone prose while project.json owns the actual milestone state. A catalog-only OPEN->FROZEN transition would therefore create immediate internal contradiction. This task authorizes the smallest transition-safe repair and the conditional freeze in one bounded candidate, avoiding another mechanical repair/audit cycle."

objective: "Remove transient duplicated ownership of milestone OPEN state from the three affected migrated Markdown documents, independently re-run semantic closure, and atomically freeze the documentation milestone only if the complete transition candidate is truthful and derives DOCS_READY=TRUE."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and require dev equals the exact handoff base with topology exactly {dev, main}."
    - "Confirm TASK-0022 GAP-001 against current docs/PRODUCT.md, docs/DATA.md and docs/ARCHITECTURE.md and docs/catalog/project.json before mutation."
    - "Independently re-run the complete semantic closure audit against current canonical CONSTITUTION.md, OBJECTIVE.md, spec/** and design/**. Do not trust prior task labels as proof of closure."
    - "If any material semantic omission, contradiction, stale assumption, authority drift, false N/A, unresolved product/provider/support meaning, or other genuine design blocker exists beyond the known transition coupling, make no implementation mutation, keep scope OPEN, publish the exact blocker and stop BLOCKED."
    - "Only if the semantic audit otherwise passes, replace only the transient present-tense milestone OPEN/not-frozen assertions in docs/PRODUCT.md, docs/DATA.md and docs/ARCHITECTURE.md with transition-safe wording that does not independently own mutable milestone state. The catalog remains the sole migration milestone-state authority."
    - "The prose repair must preserve all product/data/architecture semantics, migration authority NONE, legacy authority, UNK resolution state, relation mappings, provider lifecycle, exact-contract deferral, and the distinction between DOCS_READY, DESIGN LOCK and authority cutover."
    - "In the same bounded implementation candidate, change docs/catalog/project.json milestone.scope_state from OPEN to FROZEN. Do not create an intermediate published state where prose and catalog disagree."
    - "Validate the exact combined candidate against the pinned agent-documents model. Require zero model/reference/traceability/reachability/orphan/unresolved/blocking defects and derived DOCS_READY=TRUE."
    - "If combined-candidate validation fails, do not claim closure or DOCS_READY. Stop fail-closed with exact evidence; do not broaden into neighboring redesign."
    - "Do not perform operator DESIGN LOCK, authority cutover, legacy retirement, standards assessment, exact machine-contract materialization, implementation planning/code, provider activation/configuration, spend authorization, staging/main mutation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery or validation probes."
    - "Publish exactly one bounded implementation commit non-force to dev only when the combined transition is justified, then one separate report-only child and stop at NEEDS_REVIEW. If blocked before implementation, publish only the truthful canonical report and stop BLOCKED."

structure_policy:
  expected_new_files:
    - .agent/tasks/TASK-0023/report.yaml
  allowed_existing_files:
    - docs/PRODUCT.md
    - docs/DATA.md
    - docs/ARCHITECTURE.md
    - docs/catalog/project.json
    - .agent/tasks/TASK-0023/task.yaml
  unlisted_new_files:
    allowed: false
    max: 0
  allow_new_top_level_directories: false

invariants:
  - "Legacy CONSTITUTION.md, OBJECTIVE.md, spec/** and design/** remain canonical and unchanged."
  - "docs/** remains MIGRATION DRAFT / AUTHORITY NONE even if DOCS_READY=TRUE; DOCS_READY is not authority cutover."
  - "All ACT/ROL/FTR/ACC/FLW/SYS/DAT/IFC/EXT/CAP/DEC identities and typed relations remain unchanged."
  - "UNK-001..UNK-009 remain RESOLVED."
  - "The three Markdown edits remove only duplicated transient milestone-state assertions; they do not introduce a new closure owner or redesign semantic content."
  - "Exact machine-contract materialization remains a later boundary and is not a reason to reopen semantic INTERFACES migration."
  - "No design lock, cutover, standards PASS, code, schema, provider activation, staging/main mutation, promotion or release."

acceptance_criteria:
  - id: AC-1
    requirement: "Independent semantic closure audit finds no material blocker beyond TASK-0022 GAP-001 transition coupling."
  - id: AC-2
    requirement: "PRODUCT, DATA and ARCHITECTURE no longer independently hard-code mutable milestone OPEN/not-frozen state; their replacement wording is transition-safe and semantically neutral beyond closure-state ownership."
  - id: AC-3
    requirement: "The exact implementation candidate atomically combines the three bounded prose repairs with project.json milestone.scope_state OPEN->FROZEN, with no unrelated semantic mutation."
  - id: AC-4
    requirement: "Pinned-model validation of that exact combined candidate has zero model/reference/traceability/reachability/orphan/unresolved/blocking defects and derives DOCS_READY=TRUE."
  - id: AC-5
    requirement: "Legacy authority remains unchanged; docs/** remains authority NONE; DOCS_READY does not imply DESIGN LOCK, authority cutover, standards PASS, implementation readiness, promotion or release."
  - id: AC-6
    requirement: "Implementation/report lineage is exact: one bounded implementation commit then one report-only child; main and branch topology remain unchanged."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh exact refs/topology/task/pins; require dev equals exact handoff base and topology exactly {dev, main}."
      required: true
    - id: CHECK-2
      command_or_check: "Confirm the three current hard-coded OPEN assertions and independently re-run full semantic closure against all canonical legacy owners before mutation."
      required: true
    - id: CHECK-3
      command_or_check: "If semantic closure otherwise passes, construct one exact combined candidate changing only PRODUCT/DATA/ARCHITECTURE transient state prose plus project.json OPEN->FROZEN; verify no unrelated identity/relation/semantic changes."
      required: true
    - id: CHECK-4
      command_or_check: "Run pinned agent-documents closure validation against the exact combined candidate and require DOCS_READY=TRUE with zero defects."
      required: true
    - id: CHECK-5
      command_or_check: "Publish at most one implementation commit plus one report-only child, refresh final refs/topology, and stop NEEDS_REVIEW; if a gate fails before admissible implementation, report BLOCKED truthfully."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

