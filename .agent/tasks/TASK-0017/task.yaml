structure_authority:
  status: RESOLVED
  source: "Accepted FTR-007..FTR-053 detailed surface; accepted DAT/IFC/EXT mappings; current CAP-001..CAP-005; canonical design/04, design/06 and design/07 build/buy/runtime/provider boundaries."
  rationale: "TASK-0013 left all 47 detailed feature capability relations unresolved through UNK-009 because CAP-001..CAP-005 were proven only against the six macro anchors. DATA/IFC/EXT expansion is now accepted, including EXT-005 object/media storage, EXT-006 payment/subscription observations and EXT-007 secret custody. This task must determine whether CAP-001..CAP-005 already cover each detailed feature and add only minimum boundary-sized CAP identities where distinct project/external responsibility and build/buy semantics are materially required."

objective: "Resolve UNK-009 by mapping FTR-007..FTR-053 to the smallest materially complete CAP/build-buy surface, preserving CAP-001..CAP-005 and adding only justified capability boundaries rather than one CAP per feature/provider/implementation concern."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and resolve FTR-007..FTR-053 plus current SYS/DAT/IFC/EXT/CAP/DEC state and only canonical architecture/provider sections needed for material capability/build-buy judgment."
    - "Preserve CAP-001..CAP-005 identities, meanings, dispositions, SYS/EXT/DEC ownership and exit boundaries exactly unless canonical truth demonstrates a material contradiction; contradiction is a blocker, not permission for silent rewrite."
    - "For every FTR-007..FTR-053 capability relation, reuse CAP-001..CAP-005 only where the feature materially depends on that capability boundary. Do not mechanically copy the six macro-anchor mappings."
    - "Add only minimum new CAP identities where current detailed learner/admin behavior plus accepted EXT-005..EXT-007 or other already-canonical project responsibility proves a distinct build/buy boundary. Candidate concerns may include object/media custody, commercial entitlement/payment reconciliation, secret custody/security operations, or other truly separate responsibility boundaries; merge where ownership/disposition/exit semantics are genuinely the same."
    - "Each new CAP must be boundary-sized rather than feature-sized or vendor-sized, use only BUILD/BUY/HYBRID/DEFER semantics permitted by the pinned model, have valid SYS/EXT relations, a material DEC ref, structural ARCHITECTURE boundary/exit evidence, and no provider lifecycle advancement."
    - "Do not create one CAP per FTR, practice mode, micro-skill, provider/model alias, endpoint, table, queue, bucket, UI surface, permission, or runtime helper. A selected/TBD provider sub-route does not itself require a CAP identity when an existing provider-neutral capability boundary already owns it."
    - "Replace every FTR-007..FTR-053 relations.capabilities unresolved_ref UNK-009 with truthful exact CAP refs. Genuine N/A is allowed only if canonical behavior demonstrates no material capability relation; uncertainty is never N/A."
    - "Extend docs/ARCHITECTURE.md only enough to explain any new material CAP boundaries, dispositions, project/external ownership, decision refs and exit semantics. Preserve existing architecture and do not materialize implementation components or provider configuration."
    - "Add only the minimum new DEC records required by any new CAP build/buy choices. Reuse an existing DEC only when its subject/outcome actually governs the new capability. Do not rewrite DEC-001..DEC-004."
    - "Resolve UNK-009 only when all 47 detailed feature capability relations are complete and the CAP inventory is materially complete for current design. Add dedicated docs/DECISIONS.md#UNK-009 resolution evidence and valid resolved_by_ref attribution."
    - "Keep milestone.scope_state OPEN. After successful UNK-009 resolution, remaining closure blocker should be SCOPE_OPEN only; do not freeze the milestone or claim DOCS_READY in this task."
    - "Do not modify accepted DAT/IFC/EXT identities or relations except deterministic reference-accounting required by new CAP records. Do not activate/configure providers, authorize spend, define exact contracts/schema/code, create branches, or mutate main/staging."
    - "Current execution context is phone/ChatGPT+GitHub only. Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "Validate the exact candidate against the pinned agent-documents model. Require zero model/reference/traceability/reachability/orphan defects. After UNK-009 resolution, require zero unresolved relation/blocking unknown defects and exactly the intentional OPEN-scope closure blocker."
    - "Publish one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW."

