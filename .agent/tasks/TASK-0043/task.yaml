structure_authority:
  status: RESOLVED
  source: >-
    Current accepted TASK-0042 state plus canonical four-skill Objective and the concrete dev materializer implementation.
  rationale: >-
    The next product-breadth step is the first Listening slice. Canonical Listening feature, practice-mode, skill-leaf,
    official-family, content-context, and AT-02 authority already exists, but tools/canonical/materialize.py hard-codes
    tools/slice/reading-training.json and reading-specific generated registry/trace paths. Adding Listening directly would
    either place cross-skill authority inside a misleading Reading-named global artifact or duplicate the materializer.
    The smallest sufficient correction is to generalize this existing materialization seam before adding Listening.

objective: >-
  Remove the single-Reading-slice coupling from canonical materialization with the smallest deterministic design so the
  existing global canonical registry can support multiple bounded slice descriptors without changing current Reading
  product semantics. Preserve the current Reading slice exactly, create no Listening slice yet, and leave a simple
  deterministic path for TASK-0044 to materialize the first Listening slice.

scope:
  required_changes:
    - >-
      Make tools/canonical/generated/registry.json the sole generated global canonical registry output. Remove the legacy
      generated tools/canonical/generated/reading-training-registry.json after all repository references have moved.
    - >-
      Generalize tools/canonical/materialize.py so it deterministically discovers source slice descriptors from exactly
      tools/slice/*.json, sorted by path/name, validates every slice reference against the same global canonical registry,
      and writes/checks each trace at tools/slice/generated/<slice-stem>-trace.json.
    - >-
      Keep tools/canonical/source-map.json as the sole explicit canonical-source map. Do not add auto-discovery of canonical
      docs, plugin hooks, registries of registries, configuration frameworks, or a second materializer.
    - >-
      Preserve tools/slice/reading-training.json unchanged and require its generated
      tools/slice/generated/reading-training-trace.json to remain semantically and, unless an unavoidable deterministic
      path-independent serialization change is proven, byte-for-byte unchanged.
    - >-
      Update services/core-api/cmd/seed/main.go only as required to use the new global registry path by default. Preserve
      seed behavior, fixture behavior, content semantics, idempotency, and governance-state preservation.
    - >-
      Extend tools/canonical/test_materialize.py with focused tests proving deterministic multi-slice discovery/output,
      shared global-registry reference validation, and preservation of existing source-map authority boundaries.
    - >-
      Regenerate only deterministic canonical outputs required by the new materializer shape. Do not add any Listening
      feature/mode/family/content/context to source-map or generated artifacts in this task.
    - >-
      Construct and verify one implementation candidate. Use repository-native verification locally/native through Codex
      when available. After the candidate is stable, create one sentinel-only child updating
      .github/verification-boundary/candidate and require exactly one fresh GitHub Actions full ./verify PASS bound to the
      exact candidate. Publish one report-only child only after authoritative PASS, then stop at NEEDS_REVIEW.

  allowed_existing_files_or_components:
    - tools/canonical/materialize.py
    - tools/canonical/test_materialize.py
    - tools/canonical/generated/reading-training-registry.json
    - tools/slice/reading-training.json
    - tools/slice/generated/reading-training-trace.json
    - services/core-api/cmd/seed/main.go
    - .github/verification-boundary/candidate
    - .agent/tasks/TASK-0043/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "No learner-visible, Planner, Assessment, Progression, API, DB, Web, content, or IELTS semantic changes."
  - "No Listening slice or Listening canonical source-map entries are introduced by TASK-0043."
  - "tools/canonical/source-map.json remains unchanged and remains the explicit canonical-source authority map."
  - "tools/slice/reading-training.json remains unchanged."
  - "The global canonical registry content remains derived only from source-map + canonical owner blobs."
  - "Each source slice descriptor is validated independently against the same generated global registry."
  - "Slice discovery is bounded to tools/slice/*.json and deterministic; generated/ is output only."
  - "No plugin system, loader framework, manifest-of-manifests, registry service, database, queue, workflow, or new dependency."
  - "No main mutation, promotion, release, branch creation, PR creation, or repository metadata mutation."

forbidden_changes:
  - "Do not modify canonical docs, source-map.json, OBJECTIVE.md, CONSTITUTION.md, contracts, public/internal API semantics, DB schema/queries, Planner, Assessment, Progression, Web, content/bootstrap fixtures, providers, dependencies, or workflow definitions."
  - "Do not add tools/slice/listening-*.json or any Listening implementation in this task."
  - "Do not preserve reading-training-registry.json as a second generated compatibility copy after migration; there must be one global generated registry owner."
  - "Do not make materialization recursively scan arbitrary repository JSON or canonical docs."
  - "Do not use GitHub Actions as an iterative debugger; one fresh exact-candidate proof only after narrower verification passes."

structure_policy:
  expected_new_files:
    - tools/canonical/generated/registry.json
    - .agent/tasks/TASK-0043/report.yaml
  allowed_existing_files:
