acceptance_criteria:
  - id: AC-1
    requirement: "Canonical registry is global rather than Reading-named."
    evidence_required: >-
      registry.json is the sole generated global canonical registry; all live code/tool references use it and
      reading-training-registry.json is absent from the exact candidate tree.
  - id: AC-2
    requirement: "Materializer supports multiple bounded slice descriptors deterministically."
    evidence_required: >-
      Focused tests prove sorted tools/slice/*.json discovery, deterministic per-slice trace paths, independent reference
      validation against one global registry, and deterministic repeated output.
  - id: AC-3
    requirement: "Current Reading semantics do not drift."
    evidence_required: >-
      tools/slice/reading-training.json is unchanged; its trace retains the same slice payload and canonical reference
      meaning; no learner/runtime/content/API semantic file changes beyond the seed registry-path wiring.
  - id: AC-4
    requirement: "Canonical authority boundaries remain explicit and narrow."
    evidence_required: >-
      source-map.json is unchanged; forbidden-source and duplicate-ID tests remain PASS; materializer does not discover
      canonical authority outside the existing explicit source map.
  - id: AC-5
    requirement: "Seed behavior is unchanged except registry filename."
    evidence_required: >-
      Exact diff in services/core-api/cmd/seed/main.go is limited to the default canonical registry path and full repository
      verification proves existing seed/idempotency/governance-state behavior.
  - id: AC-6
    requirement: "No framework expansion or premature Listening implementation occurs."
    evidence_required: >-
      Candidate adds no dependencies, docs/source-map changes, slice manifest framework, plugins, Listening descriptor,
      Listening runtime/content, new services, or unrelated refactor.
  - id: AC-7
    requirement: "Exact candidate receives one bounded authoritative proof."
    evidence_required: >-
      One sentinel-only child binds the immutable implementation candidate; exactly one fresh GitHub Actions run checks out
      that candidate detached, asserts exact HEAD, and completes full ./verify PASS before report publication.
  - id: AC-8
    requirement: "Publication lineage is reconstructible."
    evidence_required: >-
      Implementation candidate is a direct child of the exact handoff base; sentinel is sentinel-only; report is report-only
      and a direct child of the successful sentinel; topology remains exactly {dev, main}.

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Verify exact TASK-0043 revision 1 handoff base, dev/main topology, pinned agent-skills revision, structure authority, and current execution capability before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Run focused canonical materializer tests including new multi-slice cases and materialize/check determinism."
      required: true
    - id: CHECK-3
      command_or_check: "Inspect exact base-to-candidate diff and prove source-map.json and reading-training.json are unchanged, legacy registry is removed, registry.json is sole global registry, and seed change is path-only."
      required: true
    - id: CHECK-4
      command_or_check: "Run repository-native ./verify on the exact candidate through the available native Codex execution surface before remote proof when feasible."
      required: true
    - id: CHECK-5
      command_or_check: "Create exactly one sentinel-only child and require exactly one fresh GitHub Actions full ./verify PASS bound to the exact candidate."
      required: true
    - id: CHECK-6
      command_or_check: "Publish one report-only child after PASS and stop at NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: true
    mechanism: "repository-native GitHub Actions .github/workflows/verify.yml via one sentinel boundary"
    expected_signal: "exact boundary->candidate binding PASS, detached exact candidate HEAD assertion PASS, canonical materialization PASS, generated drift checks PASS, Go/seed/integration PASS, Web/Playwright/build PASS, and full ./verify PASS"

