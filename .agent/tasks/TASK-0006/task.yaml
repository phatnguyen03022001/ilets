structure_authority:
  status: RESOLVED
  source: "agent-documents INTERFACES template/model plus canonical IELTS design/04-application-flows.md, design/05-api.md, design/06-implementation-stack.md and only the minimum design/07-third-party-services.md context needed to preserve provider-neutral boundaries."
  rationale: "Current canonical design already fixes the material public Core API boundary, the internal Core->Evaluator boundary, durable asynchronous work semantics, and machine-contract materialization rules. This slice migrates those semantic interface identities only. Exact OpenAPI/wire schemas remain downstream machine-contract artifacts after documentation closure/lock; external dependency/provider inventory remains a separate unresolved domain concern."

objective: "Create the non-authoritative INTERFACES migration draft and smallest truthful IFC catalog layer for the accepted target-to-evidence-to-next-action slice, resolving feature interface relations only where current canonical truth supports material boundaries while preserving external dependency/provider and exact machine-contract work for later authority."

scope:
  required_changes:
    - "Create docs/INTERFACES.md as MIGRATION DRAFT / AUTHORITY NONE. Describe only material public/internal contract semantics, synchronous/async operation classes, data-exchange/trust boundaries, idempotency/failure semantics, and exact-contract materialization/evolution rules already owned by canonical design."
    - "Materialize only material IFC-* identities in docs/catalog/project.json. Prefer stable semantic boundaries such as the learner/admin-facing Core public API, internal Core->Evaluator capability contract, and any genuinely material async/job/command boundary already required by current flows. Do not create one IFC per endpoint/button/DTO."
    - "Assign owner_system_ref and peer_refs only from accepted ACT/SYS/EXT identities actually available in this slice. Do not invent EXT records merely to satisfy peer shape; if a provider-specific boundary cannot be represented truthfully without EXT migration, leave that relation outside this bounded IFC slice."
    - "Update existing FLW-* interface_refs and FTR.interfaces relations only where the migrated IFC inventory fully and truthfully covers those material boundaries. Keep unresolved_ref -> UNK-002 for any feature whose interface relation remains unresolved; do not use false N/A."
    - "Resolve UNK-002 only if every affected migrated feature interface relation is truthfully resolved and the bounded interface question for this slice is actually closed. If resolved, follow exact V1 unknown-resolution rules with dedicated docs/DECISIONS.md#UNK-002 evidence and valid resolved_by_ref attribution. Otherwise keep UNK-002 OPEN DESIGN."
    - "Advance only interfaces.contracts, interfaces.async_jobs_commands, and interfaces.data_exchange_trust when non-empty INTERFACES sections actually establish design-sufficient L1 treatment. Keep interfaces.external_dependencies and interfaces.dependency_failure_exit at NONE unless the task is revised; UNK-003 remains OPEN DESIGN."
    - "Do not create contracts/http/**, OpenAPI, generated bindings, exact wire fields/status codes, SDKs, transport DTOs, implementation code, provider adapters, EXT/CAP/DEC identities, or deployment configuration. API-first here means semantic/authority/contract boundary first; exact machine contracts materialize only after docs closure and explicit lock."
    - "Preserve Core as the single learner/admin product API authority and sole application-runtime persistence path. Web cannot become a second domain API; Evaluator remains a bounded internal capability and cannot become public product authority."
    - "Validate exact candidate catalog/reference/reachability/closure semantics against agent-documents@acb3f02616e700190586681306a86905792e4c07. Model/reference/traceability/orphan errors are not acceptable; unfinished migration closure blockers are."
    - "Publish one bounded implementation commit non-force to dev, then a separate report-only child and stop at NEEDS_REVIEW."

  allowed_existing_files_or_components:
    - docs/catalog/project.json
    - docs/DECISIONS.md
    - .agent/tasks/TASK-0006/task.yaml
  expected_files_are_restrictive: true

structure_policy:
  expected_new_files:
    - docs/INTERFACES.md
    - .agent/tasks/TASK-0006/report.yaml
  unlisted_new_files:
    allowed: false
    max: 0
    within: []
  allow_new_top_level_directories: false
  allow_new_shared_modules: false

invariants:
  - "CONSTITUTION.md, OBJECTIVE.md, spec/** and design/** remain canonical; docs/* remain authority NONE until explicit cutover."
  - "model_version remains 1 and milestone.scope_state remains OPEN."
  - "Existing ACT/ROL/FTR/ACC/FLW/SYS/DAT identities and accepted product/behavior/architecture/data semantics remain unchanged except authorized interface relation resolution."
  - "No EXT/CAP/DEC identity and no provider/deployment migration is introduced."
  - "UNK-003 and UNK-004 remain OPEN DESIGN; UNK-002 resolves only if its bounded question is actually closed."
  - "No exact machine contract or generated binding is materialized in this slice."
  - "No DOCS_READY, design lock, standards PASS/level, implementation-readiness, promotion or release claim."
  - "Branches remain exactly {dev, main}; main remains e707aeee43411cc8f99448b63220eb8beff552b6."

forbidden_changes:
  - "Do not modify legacy canonical docs, docs/PRODUCT.md, docs/BEHAVIOR.md, docs/ARCHITECTURE.md, docs/DATA.md, code, contracts/**, workflows, tools, research, evidence, main, or external repositories."
  - "Do not invent endpoint-per-feature inventories, exact HTTP payload fields, external provider identities, callback implementations, queue/provider authority, API gateway/load balancer abstractions, or another semantic owner."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: forbidden
  public_contract_change: forbidden
  blocking_gap_behavior: BLOCKED

continuation_policy:
  mode: MANUAL
  stop_conditions: [BLOCKED, STALE_STATE, AUTHORITY_REQUIRED, CURRENT_PHASE_CAPABILITY_UNAVAILABLE, REVIEW_REQUIRED, REVERIFY_REQUIRED, USER_STOP]

