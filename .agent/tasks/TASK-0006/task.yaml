  REVIEW: [exact_commit_report_resolution, repository_content_write]

acceptance_criteria:
  - id: AC-1
    requirement: "INTERFACES migration preserves canonical semantic and authority boundaries."
    evidence_required: "INTERFACES/catalog remain authority NONE; legacy API/runtime owners are unchanged; Web/Core/Evaluator authority split is preserved."
  - id: AC-2
    requirement: "Material interface identity/ownership is truthful and minimal."
    evidence_required: "IFC inventory contains only material boundaries justified by current canonical flows/design, with valid owner/peer relationships and no endpoint/DTO/provider inflation."
  - id: AC-3
    requirement: "Feature/flow interface relations and UNK-002 evolve without false closure."
    evidence_required: "Typed IFC refs replace unresolved_ref only where fully supported; remaining unknown relations stay explicit; UNK-002 resolves only if its bounded question is actually closed under V1 rules."
  - id: AC-4
    requirement: "Interface coverage advances without external-dependency or exact-wire overreach."
    evidence_required: "Only supported interface concerns reach L1; external_dependencies/dependency_failure_exit remain NONE unless separately authorized; no OpenAPI/generated binding/provider inventory appears."
  - id: AC-5
    requirement: "Candidate remains structurally valid and intentionally incomplete."
    evidence_required: "Zero model/reference/traceability/orphan errors under the pinned validator; remaining closure blockers correspond to unfinished migration truth."
  - id: AC-6
    requirement: "Execution is lineage-exact and bounded."
    evidence_required: "One direct implementation child of exact base changes only docs/INTERFACES.md, docs/catalog/project.json and optional docs/DECISIONS.md UNK-002 resolution evidence; report is a separate report-only child; main/topology unchanged."

