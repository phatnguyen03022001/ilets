  - id: AC-4
    requirement: "UNK-006 is RESOLVED only after complete detailed DATA mapping, with valid resolution evidence and attribution; UNK-007..UNK-009 remain explicit downstream DESIGN blockers and milestone remains OPEN."
  - id: AC-5
