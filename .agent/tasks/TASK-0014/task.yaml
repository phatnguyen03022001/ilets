structure_authority:
  status: RESOLVED
  source: "Accepted TASK-0013 detailed feature inventory plus canonical spec/01, spec/08, spec/09, spec/10 and design/00, design/01, design/03, design/04, design/06 DATA-owning semantics."
  rationale: "TASK-0013 intentionally left every new detailed feature DATA relation unresolved through UNK-006 because DAT-001..DAT-012 were proven only for the six macro anchors. The next bounded step is to determine which existing DAT identities truthfully cover each detailed feature and which additional semantic DATA identities are materially required by detailed learner, media/content, entitlement, privileged policy/security and audit behavior."

objective: "Resolve UNK-006 by extending the minimum semantic DATA inventory only where current canonical truth requires it and by mapping every FTR-007..FTR-053 data relation to exact DAT identities, without inventing database schema, storage implementation, interface/dependency/capability state or false N/A."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and resolve current docs/DATA.md, current catalog, FTR-007..FTR-053 behavior, and only the canonical legacy owners necessary to determine material semantic data identity/ownership."
    - "Preserve DAT-001..DAT-012 identities, meanings, kinds and SYS-002 ownership exactly unless current canonical truth demonstrates a material contradiction; such a contradiction is a blocker, not permission for silent rewrite."
    - "For every FTR-007..FTR-053 DATA relation, reuse existing DAT-* refs only when the detailed feature truly reads, creates, mutates, derives or materially depends on that semantic data identity. Do not copy macro feature mappings mechanically."
    - "Add only the minimum additional DAT identities required by current canonical detailed behavior. Consider semantic state such as learner knowledge/review material, media/content source or operational state, entitlement, authorization/policy, privileged work or consequential audit only where canonical owners require a distinct material identity; merge when ownership/lifecycle/history semantics are genuinely the same."
    - "Every new DAT identity must have one stable semantic meaning, a justified PERSISTENT or MATERIAL_EPHEMERAL kind, SYS-002 Core ownership unless canonical architecture explicitly proves another authoritative owner, and a structural DATA doc_ref. Do not create one DAT per feature, screen, provider, database table, event, DTO or implementation cache."
    - "Extend docs/DATA.md only enough to explain each new material DAT identity plus any lifecycle/retention/consistency/lineage implications that are new relative to DAT-001..DAT-012. Do not restate unchanged DATA prose."
    - "Replace each FTR-007..FTR-053 relations.data unresolved_ref UNK-006 with truthful typed refs once the complete mapping is known. Genuine N/A is allowed only when canonical behavior demonstrates the feature has no material DATA relation; migration uncertainty is never N/A."
    - "Resolve UNK-006 only when all 47 detailed feature DATA relations are typed or genuine N/A and the resulting DAT inventory is materially complete for current design. Add dedicated docs/DECISIONS.md#UNK-006 resolution evidence and valid resolved_by_ref attribution."
    - "Do not modify IFC/EXT/CAP relations or resolve UNK-007, UNK-008 or UNK-009. Keep milestone.scope_state OPEN and preserve all existing FTR/ACC/FLW/DEC semantics outside the exact UNK-006/DATA delta."
    - "Do not define SQL tables/columns/indexes, ORM models, exact retention durations, API payloads, provider identities, queues, caches, storage buckets, schema migrations or implementation code."
    - "Current execution context is phone/ChatGPT+GitHub only. Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Do not invoke branch-creation primitives."
    - "Validate the exact candidate against the pinned agent-documents model. Require zero model/reference/traceability/reachability/orphan defects. Remaining intentional blockers must be limited to OPEN scope plus unresolved downstream UNK-007..UNK-009 and their relation states."
    - "Publish one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW."

