    - "Preserve implementation 0bc42d3f07f0f9893f10ad5093586f91b0bdc147 byte-for-byte and preserve boundary ed6910c2876d696ecce9e3f1bae156ce2a00d384; do not create a replacement implementation or second boundary."
    - "Reproduce the execution-surface defect: Actions produced zero runs because verify was manually disabled at boundary push time; after re-enable, dev's workflow definition has no workflow_dispatch path for dev, so the missed event cannot be manually replayed against dev."
    - "Modify only .github/workflows/verify.yml in one verification-recovery commit."
    - "Keep the existing sentinel-bound exact-candidate architecture. Add workflow_dispatch and make verification binding robust to a recovery commit after the boundary: from the current ref HEAD, resolve the latest reachable commit that changed .github/verification-boundary/candidate; require that commit to change only the sentinel; read the candidate SHA from that boundary version; require candidate == boundary parent; then checkout and run ./verify on that exact candidate."
    - "Retain push verification on dev and include .github/workflows/verify.yml itself in the push path filter so the verification-recovery commit can enqueue the now-enabled workflow without another boundary mutation."
    - "Use sufficient fetch depth to prove the boundary/candidate ancestry from the recovery commit."
    - "Do not weaken exact-candidate proof: the workflow must not verify current HEAD, an arbitrary input SHA or a non-parent candidate."
    - "Require the resulting GitHub Actions run to identify candidate 0bc42d3f07f0f9893f10ad5093586f91b0bdc147 and execute ./verify on that exact detached commit."
    - "If the recovery push enqueues no run, or the run cannot prove the exact candidate binding, publish a truthful BLOCKED report with exact execution-surface evidence and stop."
    - "If the exact candidate run completes PASS, publish exactly one report-only child adding only .agent/tasks/TASK-0033/report.yaml and stop at NEEDS_REVIEW."
    - "If the exact candidate run executes and FAILS, publish a truthful BLOCKED report containing the exact failing job/step/log evidence; do not mutate the candidate under this revision."
    - "Preserve canonical docs authority, DESIGN LOCK, CONSTITUTION.md, OBJECTIVE.md, docs/catalog identities/relations/FROZEN state, exact contracts and runtime semantics."
    - "Do not perform repository subtraction, standards assessment, feature implementation, provider activation, spend authorization, main/staging mutation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe local/runtime/Codex."

