  - "docs/** remains MIGRATION DRAFT / AUTHORITY NONE."
  - "No guardian/payer relationship automatically implies LEARNER, COLLABORATOR, REVIEWER, ADMIN or OWNER authorization."
  - "No guardian/payer relationship automatically grants learner-history, recording, AI-conversation, evidence, gap/weakness or other protected-data access."
  - "Commercial payment relationship remains distinct from learner identity, RBAC and learning/evidence truth."
  - "Jurisdiction-specific minor/consent/legal rules remain external mutable policy and release/compliance evidence."
  - "Existing product/learning/evidence/provider/runtime semantics remain unchanged except the minimum successor migration repair required by this boundary."
