acceptance_criteria:
  - id: AC-1
    requirement: "The successor migration explicitly preserves the canonical distinction among learner, guardian/legal representative and payer where applicable, without conflating relationship identity with RBAC authorization."
  - id: AC-2
    requirement: "Guardian/payer status alone grants no unrestricted protected learner-data access; representative consent/export/deletion semantics remain purpose-scoped and policy-governed without freezing jurisdiction-specific law into product semantics."
  - id: AC-3
    requirement: "Only directly required successor docs/catalog identities and typed relations change; no family-account/product/runtime/provider/schema/API-detail expansion is invented."
  - id: AC-4
    requirement: "Independent semantic comparison finds no remaining material omission or contradiction for the repaired boundary versus canonical owners."
  - id: AC-5
    requirement: "If and only if AC-1..AC-4 pass, milestone.scope_state is FROZEN and pinned-model validation has zero defects/blockers with derived DOCS_READY=TRUE."
  - id: AC-6
    requirement: "Legacy authority and docs AUTHORITY NONE remain unchanged; DESIGN LOCK and all downstream lifecycle gates remain unclaimed."
  - id: AC-7
    requirement: "Implementation/report lineage is exact; main and topology remain unchanged."

