structure_authority:
  status: RESOLVED
  source: "Independent red-team comparison of canonical design/00 against the accepted TASK-0024 successor migration."
  rationale: "Canonical design requires the system, where applicable, to distinguish learner, guardian/legal representative and payer, while guardian/payer status alone grants no unrestricted learner-data access and representative consent/export/deletion actions remain purpose-scoped. The FROZEN successor migration currently materializes learner, AI support, optional human expert and privileged human operator only. This is a migration-completeness defect, not a request to redesign the product or create generic family-account machinery."

objective: "Reopen only the documentation scope necessary to preserve the canonical minor/guardian/legal-representative/payer boundary in the successor migration, close any directly required actor/relation semantics, and refreeze only if the repaired migration is again semantically complete and derives DOCS_READY=TRUE."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and require dev equals the exact handoff base with topology exactly {dev, main}."
    - "Reproduce the omission by comparing canonical design/00-learning-experience.md minor-safe learner experience semantics with current docs/PRODUCT.md and docs/catalog/project.json before mutation."
    - "Treat this as an actor/relationship/authorization/privacy migration defect. Do not infer that guardian or payer must be RBAC role bundles. Relationship/participant identity and effective authorization are distinct concepts."
    - "Materialize the minimum explicit successor semantics required to distinguish learner, guardian/legal representative and payer where applicable. Guardian or payer relationship alone must not grant unrestricted access to learner history, recordings, AI conversations, evidence, gap/weakness data, or other protected learner information."
    - "Preserve that representative consent/export/deletion actions are purpose-scoped, policy-governed and jurisdiction-dependent; do not freeze jurisdiction-specific ages, consent rules, legal entitlements or provider/legal-policy details into IELTS learning semantics."
    - "Reopen docs/catalog/project.json milestone.scope_state from FROZEN to OPEN before treating the migration as repaired. Do not claim DOCS_READY while the repair is in progress."
    - "Audit only the directly affected successor owners and catalog relations needed to preserve this canonical truth. Start from PRODUCT + catalog; touch BEHAVIOR, DATA, INTERFACES, QUALITY or DECISIONS only when current canonical truth and the pinned model require a semantic/traceability relation there. Do not modify ARCHITECTURE or DELIVERY absent a reproduced direct contradiction."
    - "If the pinned model requires new actor identities, add the minimum stable ACT-* identities. Do not create new ROL-* authorization bundles merely because guardian/payer actors exist. Add or change FTR/ACC/FLW/DAT/IFC/EXT/CAP/DEC relations only where the canonical boundary materially requires them; otherwise preserve existing inventories."
    - "Do not invent a family-account subsystem, parental dashboard, household model, billing product, legal engine, new runtime, provider, schema, API route, wire field or implementation detail merely to make the migration look complete."
    - "Independently compare the repaired successor migration against all canonical truth materially affected by this boundary, including design/00-learning-experience.md, design/04-application-flows.md, relevant privacy/data/API owners, and any referenced spec owner."
    - "If any material unresolved semantic or typed-relation requirement remains, leave milestone.scope_state OPEN, do not claim DOCS_READY, publish the exact blocker and stop BLOCKED."
    - "Only if the repaired migration fully preserves the canonical boundary with zero material blocker, change milestone.scope_state OPEN->FROZEN in the final implementation candidate, validate against the pinned agent-documents model, and require zero model/reference/traceability/reachability/orphan/unresolved/blocking defects plus derived DOCS_READY=TRUE."
    - "Documentation closure after this repair still does not imply DESIGN LOCK, authority cutover, implementation readiness, standards PASS, provider activation, promotion or release."
    - "Do not perform DESIGN LOCK, canonical cutover, legacy retirement, standards assessment, exact machine-contract materialization, implementation planning/code, provider activation/configuration, spend authorization, staging/main mutation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "Publish at most one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW. If blocked before implementation, publish only the truthful canonical report and stop BLOCKED."

