acceptance_criteria:
  - id: AC-1
    requirement: "Target-owned domain applicability inventory is finite and closed without becoming a status registry."
    evidence_required: "assurance/domain-constraint-profile.yaml identifies WEB_PRODUCTION_V1, coverage COMPLETE, and exactly the ten specified unique DCP families; no constraint contains a current PASS/PARTIAL/GAP/UNKNOWN/N/A/EXCEPTION assessment or readiness/completion/percentage field."
  - id: AC-2
    requirement: "Canonical target ownership and external source identities remain correctly separated."
    evidence_required: "Each constraint has exact target owner_ref(s) into existing QUALITY/DELIVERY authority and only concise versioned external source identities where relevant. WCAG 2.2 AA, ASVS 5.0.0, OWASP Top 10 2025, OWASP API Security Top 10 2023, current Core Web Vitals benchmarks, Next.js production/CSP guidance and Clerk resource-protection guidance are referenced without copying their full requirement catalogs."
  - id: AC-3
    requirement: "Evidence expectations are sufficient for later deterministic assessment without overclaiming."
    evidence_required: "Each family has non-empty finite evidence classes. Accessibility requires automated plus manual/non-automated proof; performance distinguishes lab/build from production-field evidence; N/A and EXCEPTION semantics require explicit reasons/references; axe/test/tool presence alone cannot satisfy blanket conformance."
  - id: AC-4
    requirement: "Profile validation fails closed."
    evidence_required: "Focused tests prove rejection of duplicate/missing families, malformed/unknown ids or sources, empty evidence requirements, invalid applicability, status/readiness/percentage authoring, invalid benchmark form, unversioned required source identities, and misuse of COMPLETE as an assessment field."
  - id: AC-5
    requirement: "Existing target verification owns assurance-profile drift detection."
    evidence_required: "Root ./verify invokes the bounded tools/assurance validation/tests without adding a second correctness command or workflow; focused validation passes and full ./verify passes on the exact candidate."
  - id: AC-6
    requirement: "No later-phase architecture leaks into Phase 4."
    evidence_required: "Candidate contains no delivery graph, assurance projection, feature matrix, readiness score, percentage, current assurance result, CI workflow or generic cross-repository framework."
  - id: AC-7
    requirement: "Publication remains bounded and independently reviewable."
    evidence_required: "Implementation candidate is a direct child of exact handoff base and changes only assurance/**, tools/assurance/** and verify; report is a direct child updating only .agent/tasks/TASK-0050/report.yaml for revision 4; both are pushed non-force to dev; main remains e707aeee43411cc8f99448b63220eb8beff552b6 and topology remains exactly dev/main before stopping NEEDS_REVIEW."

verification:
  authoritative_verification:
    required: false
    rationale: "This is target-local assurance-profile materialization. Deterministic focused validation plus the existing full repository-native ./verify is sufficient; independent remote CI is not required."
  required_checks:
    - "Focused tools/assurance tests"
    - "Deterministic validation of assurance/domain-constraint-profile.yaml"
    - "Negative tests for manual status/readiness authoring and incomplete/invalid inventory"
    - "./verify"

