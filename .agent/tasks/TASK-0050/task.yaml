structure_authority:
  status: RESOLVED
  source: "Architect Phase-4 target-local assurance boundary"
  rationale: "The smallest sufficient shape is one non-runtime target-owned assurance profile plus one bounded validator/test helper integrated into the existing root verify contract. This does not create a product authority, status database, matrix service, workflow engine or generic cross-repository framework."

objective: "Materialize a finite WEB_PRODUCTION_V1 Domain Constraint Profile for this target that closes assurance applicability inventory across ten evidence-relevant production domains, preserves versioned external source identities and canonical target-owner references, and mechanically prevents inventory coverage from being mistaken for PASS/readiness."

scope:
  required_changes:
    - "Fresh-bind TASK-0050 revision 4 at the exact handoff base and prove all required EXECUTION capabilities before mutation, including currently usable native_repository_execution on the selected CHATGPT_LOCAL surface. Treat revision-1 through revision-3 blocker evidence only as continuity evidence: no implementation candidate exists. Do not silently substitute CHATGPT_GITHUB or another execution surface if AGENT_RUNTIME is unavailable. Inspect current QUALITY, DELIVERY, stack/config/auth and root verify surfaces before choosing HOW. If a run-owned stale /tmp capability-probe artifact is found, clean only that exact artifact after proving ownership; absence or inability to prove cleanup is not permission for broad /tmp mutation."
    - "Create exactly one target-owned profile at assurance/domain-constraint-profile.yaml. It is authoritative only for target assurance applicability/inventory; it is not product/feature authority and is not implementation, release or standards-conformance status authority."
    - "Profile identity must be WEB_PRODUCTION_V1 and must declare inventory coverage COMPLETE separately from any assessment result. COMPLETE means the Architect-owned finite domain inventory is closed for this profile revision; it must not mean implementation PASS, standards conformance, release readiness or feature completion."
    - "Represent exactly ten stable constraint families, each with a unique DCP-* id, concise title, applicability, exact canonical target owner_ref(s), versioned external source identities where materially relevant, and finite required evidence classes suitable for later derived assessment."
    - "The ten families are: accessibility; authentication/authorization resource boundary; web application security baseline; API security baseline; browser/client security and secret exposure; privacy/external data egress; performance/Core Web Vitals; reliability/idempotency/recovery; deployment/migration/backup/restore/version compatibility; observability/operational provenance. Do not split them into copied external checklist rows."
    - "Accessibility must reference WCAG 2.2 AA as the target external conformance baseline and require both automated and non-automated evidence classes; existing axe automation must never be represented as blanket WCAG conformance proof."
    - "Web security must reference ASVS 5.0.0 plus OWASP Top 10 2025 as source identities. API security must reference OWASP API Security Top 10 2023. Do not copy ASVS/Top-10 requirement catalogs into the target profile."
    - "Authentication/authorization must preserve target Core ownership and the resource-side authorization principle. Clerk/client/middleware state may supply identity/session evidence but cannot become Core product authorization authority."
    - "Performance must preserve current Core Web Vitals external good benchmarks (LCP <= 2500 ms, INP <= 200 ms, CLS <= 0.1 at p75) explicitly as reference benchmarks, not repository SLOs, release gates or guarantees. Distinguish lab/build evidence from production field evidence."
    - "Deployment/production guidance may reference current Next.js production/CSP guidance, but must preserve canonical target DELIVERY ownership and must not choose a new hosting product, rollout topology, numeric SLO/RPO/RTO or infrastructure layer."
    - "Define the only allowed future derived assessment states as PASS, PARTIAL, GAP, UNKNOWN, N/A and EXCEPTION. Define their semantics mechanically, but do not author a current state for any constraint in the profile. N/A requires explicit target applicability reason; EXCEPTION requires an exact separately authorized exception reference and cannot be self-issued by the derived assessor."
    - "Create the smallest deterministic validator/test helper under tools/assurance/ that validates profile identity, exact ten-family closure, unique ids, allowed applicability/source/evidence vocabulary, owner_ref shape, source identity references, benchmark shape, and the separation between coverage and assessment."
    - "The validator must fail closed if any constraint contains manual current-status/readiness/completion/maturity/percentage fields, if coverage COMPLETE is missing, if any required family is absent/duplicated, if an external source identity is unknown/unversioned where required, or if evidence requirements are empty/malformed."
    - "Integrate only the profile validator/tests into the existing root ./verify contract so future target changes cannot silently corrupt the profile. Do not add or modify CI workflows."
    - "Run focused assurance-profile tests/validation and full repository-native ./verify on the exact implementation candidate. Publish candidate and canonical report non-force to dev, then stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - assurance/
    - tools/assurance/
    - verify
  expected_files_are_restrictive: true

invariants:
  - "docs/catalog/project.json plus canonical target docs retain all product/feature/QUALITY/DELIVERY authority. The assurance profile owns only target-specific assurance applicability and evidence expectations."
  - "Inventory coverage COMPLETE is not PASS and cannot be used as a release/readiness/completion claim."
  - "No current per-constraint assessment status is stored in assurance/domain-constraint-profile.yaml."
  - "PASS/PARTIAL/GAP/UNKNOWN/N/A/EXCEPTION are derived-assessment vocabulary only."
  - "External standards/guides remain external source identities. Their full checklists are not vendored, copied or re-authored into this repository."
  - "Tools are validation/evidence suppliers only and do not become product or assurance-policy authority."
  - "Existing root ./verify remains the one repository-native verification contract."
  - "No support repository mutation is authorized."
  - "No feature delivery graph, cross-cutting assurance projection, release readiness calculation or percentage is implemented in this task. Those belong to later phases."

forbidden_changes:
  - "Do not modify docs/, contracts/, apps/, services/, migrations, package manifests, lockfiles, provider configuration or workflows."
  - "Do not introduce a status registry, feature matrix, assurance matrix, database, dashboard, workflow engine, planner, queue, generic policy engine, external-standard mirror or generated conformance report."
  - "Do not claim WCAG, ASVS, OWASP, Core Web Vitals, production readiness, release readiness or deployment readiness PASS in this task."
  - "Do not add a current status field to any DCP constraint."
  - "Do not invent numeric SLO/RPO/RTO/capacity thresholds; the Core Web Vitals numbers are external reference benchmarks only."
  - "Do not create/delete/rename branches, force-push, mutate main, promote, deploy, tag or publish a release."

