structure_authority:
  status: RESOLVED
  source: "agent-documents V1 BEHAVIOR template + project schema at e6728594b0371e2e941c1457fc8efdc14a90deee, combined with exact current IELTS canonical behavior owners."
  rationale: "The BEHAVIOR template requires FTR-*, FLW-*, and ACC-* headings while those identities are catalog-owned. Creating BEHAVIOR without the catalog would force invented or ownerless identities; creating the catalog without BEHAVIOR would leave required behavior references unresolved. The smallest coherent slice is one atomic BEHAVIOR + initial catalog migration foundation."

objective: "Materialize the first structurally coherent agent-documents behavior migration for IELTS: create a non-authoritative BEHAVIOR migration draft and an initial schema-conformant migration catalog that assigns stable target-owned ACT/ROL/FTR/ACC/FLW identities and relations for the behavior represented in this slice, while preserving all existing canonical target semantics and keeping current legacy owners authoritative until a later explicit cutover."

scope:
  required_changes:
    - "Create docs/BEHAVIOR.md as MIGRATION DRAFT / AUTHORITY NONE. Map existing observable product behavior only; do not invent product behavior, implementation architecture, data/storage design, API shape, or quality claims."
    - "Read the exact current canonical behavior sources needed for this domain, including relevant sections of OBJECTIVE.md, spec/**, and design/00-learning-experience.md through design/04-application-flows.md plus other current canonical owners only when materially required. Preserve upstream learning truth and downstream behavior exactly."
    - "Represent the behavior domain using stable FTR-* feature headings, FLW-* critical/user/system/failure flow headings, and ACC-* acceptance headings as required by agent-documents. Every identity must be created in docs/catalog/project.json in the same implementation commit; Markdown must not become the identity owner."
    - "Create docs/catalog/project.json using model_version 1 and the exact V1 schema shape. Set milestone.scope_state to OPEN and scope_ref to docs/PRODUCT.md#Scope. The catalog is a migration artifact under the current IELTS hierarchy and has authority NONE until explicit cutover; its canonical path does not override the still-canonical CONSTITUTION/legacy owners during migration."
    - "Populate the catalog only to the extent directly supported by migrated truth in this slice: actors/roles that are already represented by docs/PRODUCT.md; behavior features, acceptance criteria, and flows represented by docs/BEHAVIOR.md; relations that can be established from current canonical truth. Do not create SYS/DAT/IFC/EXT/CAP identities merely to satisfy completeness before their domains are migrated. Use the schema's explicit relation na form only when current canonical truth supports true non-applicability; otherwise record a bounded migration unknown rather than guessing."
    - "For feature relations to not-yet-migrated domains, do not falsely declare N/A merely because migration is incomplete. If the V1 feature shape requires a relation whose target identities are not yet materialized and current truth shows the relation may exist, record an explicit UNK-* migration unknown and choose a schema-valid representation that does not misstate product semantics. If no truthful schema-valid representation exists without prematurely materializing another domain, stop BLOCKED and report the model dependency instead of weakening semantics."
    - "Set coverage entries conservatively. Product concerns may be marked actual_depth L1 only where current docs/PRODUCT.md structurally supports them. Behavior concerns may be marked actual_depth L1 only if this slice fully establishes the required L1 behavior treatment for the represented migration milestone. All not-yet-migrated concerns remain actual_depth NONE unless target evidence directly justifies otherwise. Never use coverage depth as maturity."
    - "Update docs/DECISIONS.md only as needed to record that docs/catalog/project.json now exists as a migration artifact with authority NONE until explicit cutover, and that filename/location does not itself grant canonical target authority. Preserve TASK-0001 adoption identities and candidate/frozen status statements."
    - "Do not edit docs/PRODUCT.md unless an exact reference token defect makes catalog references impossible. If such a purely structural token correction is required, it must preserve all semantics, stay inside docs/PRODUCT.md, and be reported explicitly; otherwise leave PRODUCT unchanged."
    - "Do not change CONSTITUTION.md, OBJECTIVE.md, README.md, spec/**, design/**, contracts/**, product code, runtime behavior, workflows, verification scripts, research/**, evidence/**, or current main."
    - "Do not claim DOCS_READY, documentation lock, implementation readiness, standards PASS, maturity level, N/A assurance status, exception, generated PROGRAM, or release readiness."
    - "Publish one implementation commit non-force to dev, then create .agent/tasks/TASK-0002/report.yaml as a separate report-only direct child and stop at Governing Architect review."

  allowed_existing_files_or_components:
    - docs/PRODUCT.md
    - docs/DECISIONS.md
    - .agent/tasks/TASK-0002/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Existing CONSTITUTION.md, OBJECTIVE.md, spec/**, and design/** remain canonical throughout this slice."
  - "docs/PRODUCT.md, docs/DECISIONS.md, docs/BEHAVIOR.md, and docs/catalog/project.json remain migration artifacts with target authority NONE until a later explicit cutover."
  - "Catalog owns migration identities/relations; BEHAVIOR owns migrated behavior explanation only."
  - "No FTR/ACC/FLW identity may exist only in Markdown without the same catalog identity."
  - "No current product behavior or learning truth changes."
  - "No absent migration-domain identity is converted into false N/A."
  - "agent-documents remains an unreleased candidate; target adoption does not globally stabilize it."
  - "agent-standards remains pinned to exact frozen V1; no assurance result is fabricated."
  - "Branches remain exactly {dev, main}; main remains e707aeee43411cc8f99448b63220eb8beff552b6."

forbidden_changes:
  - "Do not modify README.md, CONSTITUTION.md, OBJECTIVE.md, spec/**, design/**, contracts/**, apps/**, services/**, tools/**, .github/**, verify, compose files, research/**, evidence/**, or main."
  - "Do not create docs/ARCHITECTURE.md, docs/DATA.md, docs/INTERFACES.md, docs/QUALITY.md, docs/DELIVERY.md, generated program artifacts, assurance registries, migration databases, provider registries, or orchestration state."
  - "Do not delete, rename, or demote legacy canonical documents."
  - "Do not copy the full agent-documents model/schema or agent-standards requirement catalog into IELTS."
  - "Do not force schema validity by inventing systems/data/interfaces/dependencies/capabilities, declaring false N/A, or silently dropping known relationships."
  - "Do not trigger GitHub Actions merely for this documentation migration; no authoritative runtime verifier is required by this task."
  - "Do not create a branch, PR, tag, release, or repository metadata mutation."

