acceptance_criteria:
  - id: AC-1
    requirement: "BEHAVIOR migration preserves one canonical target authority during migration."
    evidence_required: "docs/BEHAVIOR.md is prominently MIGRATION DRAFT / AUTHORITY NONE; legacy canonical owners are unchanged; docs/DECISIONS.md makes the migration-catalog authority boundary explicit."
  - id: AC-2
    requirement: "Behavior identities and explanation obey agent-documents ownership."
    evidence_required: "Every FTR/ACC/FLW used in BEHAVIOR exists exactly once in docs/catalog/project.json with schema-valid type/relationship shape, while behavior text remains in BEHAVIOR rather than the catalog."
  - id: AC-3
    requirement: "Migrated behavior is semantically traceable to current IELTS truth."
    evidence_required: "Material functional behavior, state/transitions, invariants/permissions, errors/edges/failures, critical flows, acceptance text, and safety/human-control behavior in scope are attributable to exact canonical legacy sources; ambiguities are explicit and not guessed."
  - id: AC-4
    requirement: "The initial migration catalog is conservative and schema-shaped without false closure."
    evidence_required: "model_version=1; milestone OPEN; required top-level keys exist; references/IDs follow V1 patterns; product/behavior coverage claims are no stronger than actual migrated support; not-yet-migrated domains remain unfinished; no false N/A or invented neighboring-domain identity is used to make the catalog look complete."
  - id: AC-5
    requirement: "No readiness or assurance overclaim occurs."
    evidence_required: "No DOCS_READY, documentation lock, implementation-readiness, agent-standards PASS/level/N/A/exception, generated PROGRAM, promotion, or release claim appears."
  - id: AC-6
    requirement: "Execution is bounded and lineage-exact."
    evidence_required: "Implementation is one direct child of exact handoff base; diff contains only docs/BEHAVIOR.md, docs/catalog/project.json, optional bounded docs/DECISIONS.md update, and only if strictly required a semantic-preserving docs/PRODUCT.md reference-token fix; report is a separate report-only child; main unchanged; topology exactly {dev, main}."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh GitHub truth; require dev equals exact handoff base, main equals e707aeee43411cc8f99448b63220eb8beff552b6, topology exactly {dev, main}; resolve TASK-0002 revision 1 and exact external authority revisions; preflight GitHub-only EXECUTION capabilities."
      required: true
    - id: CHECK-2
      command_or_check: "Resolve exact agent-documents BEHAVIOR template and V1 project schema. Inspect current accepted PRODUCT/DECISIONS migration drafts and the exact legacy behavior owners required for semantic mapping."
      required: true
    - id: CHECK-3
      command_or_check: "Design the smallest coherent FTR/ACC/FLW inventory that preserves current material behavior without becoming a feature-count exercise. Assign stable IDs in the catalog first conceptually, then materialize catalog and BEHAVIOR atomically."
      required: true
    - id: CHECK-4
      command_or_check: "Perform static schema-shape and cross-reference review against project.schema.v1.json: required top-level keys, ID patterns, relation shapes, unique identities, document-reference paths/tokens, and coverage-entry forms. If truthful schema validity requires another unmigrated authority domain, stop BLOCKED rather than inventing data."
      required: true
    - id: CHECK-5
      command_or_check: "Semantic review against AC-1..AC-5. Confirm all legacy canonical sources remain byte-identical, migration authority remains NONE, and no readiness/assurance claim or false N/A appears."
      required: true
    - id: CHECK-6
      command_or_check: "Before publication refresh dev/main/topology and require exact expected parent. Publish one implementation commit non-force to dev, then create TASK-0002/report.yaml as a separate report-only child; verify exact parentage/diffs/final refs/topology and stop at NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

