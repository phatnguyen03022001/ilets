    - residual_id: FRESH-RES-001
      legacy_owner: spec/02-IELTS-MODEL.md
      sections:
        - Official fact vs learning interpretation
        - Change rule
      successor_domain: PRODUCT
      legacy_truth: >-
        External IELTS claims are governed by a mandatory epistemic distinction among
        Official Evidence, Evidence-Based Interpretation and Blueprint Inference, and
        material external IELTS drift follows an owner-first propagation rule: update the
        external-truth owner, refresh dated provenance, review affected downstream learning/
        assessment/content/design owners, preserve stable family IDs only when semantics
        remain materially the same, and never retain obsolete facts because implementation
        already encoded them.
      successor_gap: >-
        docs/product/ielts-exam-and-bands.md preserves the external fact baseline and says
        live facts must be rechecked before implementation/release, but it does not preserve
        the three-class claim/provenance contract or the owner-first downstream change rule.
        The complete successor roots, legal shards and catalog contain no equivalent owner.
      exact_evidence: >-
        The successor shard still uses the term "Blueprint Inference" in its Bands 3-9
        section while neither that shard nor another successor owner defines the complete
        Official Evidence / Evidence-Based Interpretation / Blueprint Inference contract.
      consequence: >-
        Demoting spec/02 would lose the locked rule distinguishing official IELTS truth from
        pedagogical inference and the deterministic propagation discipline for future
        external IELTS change.

    - residual_id: FRESH-RES-002
      legacy_owner: spec/11-GLOSSARY.md
      sections:
        - Assessment roles
      successor_domain: PRODUCT
      legacy_truth: >-
        Canonical term meanings distinguish Official Evidence, Evidence-Based Interpretation
        and Blueprint Inference; those meanings are consumed by Band/external-truth semantics.
      successor_gap: >-
        No successor glossary or domain section defines all three canonical terms. The
        IELTS/Band shard uses "Blueprint Inference" but leaves the terminology contract
        implicit after legacy demotion.
      consequence: >-
        The post-cutover plane would contain a materially consequential inference label with
        no canonical definition, making the locked evidence/provenance vocabulary ambiguous.

    - residual_id: FRESH-RES-003
      legacy_owner: design/00-learning-experience.md
      sections:
        - Learner mental model and progressive disclosure
        - Learner-facing visual and interaction language / Primary visual character
        - Capability-first learner language
        - Iconography
        - Imagery and background depth
        - Motion and responsiveness
        - Interaction micro-quality
        - Simple surface / deep system invariant
      successor_domain: PRODUCT
      legacy_truth: >-
        The locked learner experience requires a calm typography-led/content-first surface,
        explicit anti-pattern exclusions, capability/action/result-first copy rather than
        generic AI-branded chrome, restrained functional icon/imagery use, non-spectacle
        motion with reduced-motion/usability precedence, consistent loading/empty/error/
        focus/disabled responsive micro-quality, and progressive disclosure that keeps the
        deep ontology out of default learner navigation.
      successor_gap: >-
        Successor PRODUCT/BEHAVIOR preserve feature/navigation identities and consequential
        failure explanation, but the complete successor plane contains no semantically
        equivalent canonical visual-language, AI-chrome naming, icon/imagery/motion,
        progressive-disclosure, or interaction-micro-quality contract. PRODUCT explicitly
        leaves pixel-perfect visual design/final brand downstream, which does not preserve
        these non-pixel product-quality constraints.
      consequence: >-
        Demoting design/00 would preserve what features exist while losing material locked
        learner-experience behavior and quality constraints that implementations must obey.

    - residual_id: FRESH-RES-004
      legacy_owner: design/01-skill-features.md
      sections:
        - Beginner L1-to-English speaking scaffold
      successor_domain: BEHAVIOR
      legacy_truth: >-
        For learners unable to respond reliably to English-only prompts, existing Speaking
        features may use the configured L1 as a temporary acquisition scaffold through a
        defined L1-meaning-cue -> learner English production -> bounded correction/model ->
        scaffold reduction -> English-only -> fresh-transfer progression, with explicit
        rules preventing the L1/model from performing the target English production or
        masquerading as independent evidence.
      successor_gap: >-
        Successor PRODUCT preserves only the general L1-agnostic principle and successor
        BEHAVIOR preserves Speaking feature/capture/realtime boundaries. Neither materializes
        this learner-visible staged beginner Speaking scaffold or its feature-level rules;
        docs/behavior/practice-and-media.md also contains no corresponding L1 behavior.
      consequence: >-
        Demoting design/01 would remove an already locked beginner Speaking interaction path
        rather than merely dropping implementation detail.

