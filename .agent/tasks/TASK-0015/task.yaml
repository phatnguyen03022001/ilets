invariants:
  - "Legacy CONSTITUTION.md, OBJECTIVE.md, spec/** and design/** remain canonical and unchanged."
  - "docs/** remains MIGRATION DRAFT / AUTHORITY NONE."
  - "FTR-001..FTR-053, ACT/ROL, ACC, DAT, SYS, EXT, CAP and DEC-001..DEC-004 identities remain unchanged."
  - "IFC-001 and IFC-002 remain unchanged unless a canonical contradiction blocks execution."
  - "UNK-005 and UNK-006 remain RESOLVED; UNK-008 and UNK-009 remain OPEN and untouched except reference-accounting effects deterministically caused by resolving UNK-007."
  - "Milestone remains OPEN."
  - "No external-dependency/capability/build-buy expansion, exact contract, provider activation, code, schema, workflow, staging, main mutation, promotion or release."

acceptance_criteria:
  - id: AC-1
    requirement: "Every privileged FTR-047..FTR-053 has a truthful interface relation using exact IFC refs or demonstrated N/A; no relation remains on UNK-007."
  - id: AC-2
    requirement: "The resulting IFC inventory is the smallest materially complete semantic interface surface for current privileged design; IFC-001 is reused for ordinary learner/admin Core API crossings and no separate admin API is invented without a distinct authority/trust boundary."
  - id: AC-3
    requirement: "FLW-005..FLW-006 interface_refs reflect actual runtime crossings; purely Core-internal semantics are not given artificial interface identities."
  - id: AC-4
    requirement: "UNK-007 is RESOLVED only after complete privileged interface mapping, with valid resolution evidence and attribution; UNK-008..UNK-009 remain explicit downstream DESIGN blockers and milestone remains OPEN."
  - id: AC-5
    requirement: "Pinned-model validation has zero model/reference/traceability/reachability/orphan defects; implementation/report lineage is exact; main and topology remain unchanged."

verification:
  executor_checks:
    - id: CHECK-1
