      required: true
    - id: CHECK-2
      command_or_check: "Resolve FTR-047..053/FLW-005..006 plus canonical privileged-operation and API boundaries; distinguish semantic IFC identity from routes, DTOs, webhooks, permissions and provider interfaces."
      required: true
    - id: CHECK-3
      command_or_check: "Prove IFC-001 reuse or the minimum justified new IFC boundary, map all seven privileged interface relations, update affected grouped flow interface_refs, and resolve UNK-007 only when complete."
      required: true
    - id: CHECK-4
      command_or_check: "Run pinned-model structural/reference/reachability/orphan/unknown validation plus semantic audit AC-1..AC-4; confirm only intended downstream blockers remain."
      required: true
    - id: CHECK-5
      command_or_check: "Refresh stale state, publish one implementation commit and one report-only child non-force to dev, verify final refs/topology, stop NEEDS_REVIEW."
      required: true
