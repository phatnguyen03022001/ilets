structure_authority:
  status: RESOLVED
  source: "Accepted TASK-0013 privileged feature/flow surface plus canonical design/04-application-flows.md, design/05-api.md, design/06-implementation-stack.md and current docs/INTERFACES.md."
  rationale: "Canonical design exposes one learner/admin-facing public API through Core and routes privileged operations through the same authenticated/capability-gated Core boundary. Current IFC-001 already states that it is the learner/admin-facing Core public product API and includes privileged mutations. TASK-0013 intentionally left only FTR-047..FTR-053 interface relations unresolved through UNK-007 so this task must first prove whether IFC-001 fully covers them and add another IFC only if canonical truth demonstrates a genuinely separate semantic runtime/trust/ownership boundary."

objective: "Resolve UNK-007 by mapping the seven privileged/admin features to the smallest truthful semantic interface surface, reusing IFC-001 wherever the existing Core public API boundary fully applies and introducing no new IFC unless current canonical truth proves a distinct material interface authority boundary."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and resolve current FTR-047..FTR-053, FLW-005..FLW-006, IFC-001..IFC-002, and only the canonical API/runtime sections needed to determine privileged semantic interface crossings."
    - "Preserve IFC-001 and IFC-002 identities, ownership, peers, meanings and current learner/evaluator mappings exactly unless canonical truth demonstrates a contradiction; contradiction is a blocker, not permission for silent rewrite."
    - "Treat endpoint groups, admin routes, buttons, DTOs, resource types, SSE, webhook handlers, queue messages, provider SDKs and capability permissions as non-IFC concepts unless they cross a genuinely distinct semantic runtime/trust/ownership boundary."
    - "First test whether existing IFC-001, the Core learner/admin-facing public product API consumed through Web, fully covers each of FTR-047..FTR-053. Reuse IFC-001 when the feature is an authorized public/admin read or mutation through Web/Core, including privileged operation patterns already owned by canonical design."
    - "Add a new IFC identity only if canonical design proves a distinct material semantic interface whose owner/peer/trust boundary is not already represented by IFC-001 or IFC-002. Do not create a separate admin API merely for route organization or privilege level."
    - "Update FLW-005 and/or FLW-006 interface_refs only where the actual grouped flow crosses an existing or newly justified IFC boundary. A purely Core-internal audit/reconciliation step must not be assigned a cross-runtime IFC just to make arrays non-empty."
    - "Replace each FTR-047..FTR-053 relations.interfaces unresolved_ref UNK-007 with truthful typed refs once the complete privileged mapping is known. Genuine N/A is allowed only if canonical behavior proves a feature has no material interface relation; uncertainty is never N/A."
    - "Extend docs/INTERFACES.md only if necessary to make the privileged mapping explicit or to explain a genuinely new IFC boundary. Do not materialize OpenAPI, exact routes, DTOs, fields, status codes, generated bindings, webhook/provider authentication details, or implementation adapters."
    - "Resolve UNK-007 only when all seven privileged feature interface relations and affected grouped flow interface_refs are complete and structurally valid. Add dedicated docs/DECISIONS.md#UNK-007 resolution evidence and valid resolved_by_ref attribution."
    - "Do not modify EXT/CAP relations or resolve UNK-008 or UNK-009. Preserve the accepted DAT inventory and mappings from TASK-0014. Keep milestone.scope_state OPEN."
    - "Current execution context is phone/ChatGPT+GitHub only. Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Do not invoke branch-creation primitives. Mutation APIs are not discovery/validation probes."
    - "Validate the exact candidate against the pinned agent-documents model. Require zero model/reference/traceability/reachability/orphan defects. Remaining intentional blockers must be limited to OPEN scope plus UNK-008..UNK-009 and their relation states."
    - "Publish one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW."

