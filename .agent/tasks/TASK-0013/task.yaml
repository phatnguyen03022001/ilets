invariants:
  - "Legacy CONSTITUTION.md, OBJECTIVE.md, spec/** and design/** remain canonical and unchanged."
  - "docs/** remains MIGRATION DRAFT / AUTHORITY NONE."
  - "Milestone scope remains OPEN."
  - "Existing ACT/ROL/SYS/DAT/IFC/EXT/CAP/DEC identities remain unchanged except authorized feature/flow/acceptance/unknown relation additions and UNK-005 resolution."
  - "Practice modes, micro-skills, Knowledge Objects, media sources, entitlement states, provider/model routes and AI tutor overlay do not become duplicate feature identities."
  - "No new provider selection/activation, exact contract, code, schema, deployment, workflow, pricing/quota, staging branch, main mutation or external-repository mutation."

acceptance_criteria:
  - id: AC-1
    requirement: "The material learner feature inventory faithfully maps the canonical 40 design/01 capabilities without feature-count inflation from navigation, practice modes, micro-skills, media/source states, entitlements, providers or AI overlays."
  - id: AC-2
    requirement: "The privileged/admin/BOPS feature inventory is minimal but covers every material TASK-0012 privileged surface family with capability/RBAC boundaries preserved."
  - id: AC-3
    requirement: "Every new feature has truthful actor/role/flow and acceptance traceability; macro FTR-001..006 remain historical route anchors rather than the sole completeness surface."
  - id: AC-4
    requirement: "UNK-005 resolves only after complete feature/flow/acceptance decomposition; expanded DATA/IFC/EXT/CAP relations are either fully justified typed refs or explicit bounded OPEN DESIGN unknowns, never false N/A or speculative refs."
  - id: AC-5
    requirement: "Pinned-model validation has zero model/reference/traceability/orphan defects; milestone remains OPEN; implementation/report lineage is exact; main/topology unchanged."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh exact refs/topology/task/pins and require dev equals exact handoff base. Use GitHub-native surfaces only."
      required: true
    - id: CHECK-2
      command_or_check: "Resolve canonical design/00..04 feature/practice/media/admin boundaries and distinguish feature identity from navigation, practice packaging, ontology, source state, entitlement, provider and AI overlay concepts."
      required: true
    - id: CHECK-3
      command_or_check: "Materialize the complete minimal learner/admin FTR inventory plus grouped FLW/ACC traceability; resolve UNK-005 only if decomposition is complete and create bounded downstream relation unknowns where needed."
      required: true
    - id: CHECK-4
      command_or_check: "Run pinned-model structural/reference/feature-flow subset/reachability/orphan/unknown validation plus semantic audit AC-1..AC-4."
      required: true
    - id: CHECK-5
      command_or_check: "Refresh stale state, publish one implementation commit and one report-only child non-force to dev, verify final refs, stop NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

