structure_authority:
  status: RESOLVED
  source: "Canonical design/00-learning-experience.md, design/01-skill-features.md, design/02-practice-catalog.md, design/03-media-youtube.md and design/04-application-flows.md plus accepted TASK-0012 foundation."
  rationale: "Canonical design already distinguishes learner navigation from material feature capabilities, defines 40 named learner feature capabilities, defines 28 practice modes as packaging rather than another feature ontology, treats media as a source substrate rather than a parallel taxonomy, and defines material privileged capability/surface families. This task migrates that existing product decomposition without promoting micro-skills, practice modes, media sources, provider routes or AI overlays into duplicate FTR identities."

objective: "Resolve UNK-005 by replacing the six-macro-only completeness model with a complete material learner/admin feature decomposition and grouped flow/acceptance traceability, while keeping downstream DATA/INTERFACES/EXT/CAP relation expansion explicit and unresolved rather than fabricating coverage."

scope:
  required_changes:
    - "Extend docs/PRODUCT.md and docs/BEHAVIOR.md only as needed to state the complete material feature decomposition and its traceability boundary. Keep docs/** MIGRATION DRAFT / AUTHORITY NONE."
    - "Materialize the canonical 40 named learner feature capabilities from design/01-skill-features.md as stable catalog FTR identities. Preserve the canonical L-F01..L-F08, R-F01..R-F08, W-F01..W-F09, S-F01..S-F09 and X-F01..X-F06 identities as explicit source aliases in prose or names so mapping remains reconstructable."
    - "Materialize only the minimum additional privileged/admin/BOPS FTR identities justified by the TASK-0012 surface families and design/04 capability boundaries: content/review/release, user support, entitlement reconciliation, operations/provider/work visibility, approved policy administration, security/access administration and audit. Merge only when learner-visible/privileged behavior and acceptance are genuinely the same; do not create one feature per capability permission or role bundle."
    - "Do not create FTR identities for the seven primary navigation labels merely because they are navigation, for the 28 practice modes in design/02, for Skill Leaves/micro-skills/Knowledge Objects, for media source/transcript states, for FREE/PRO entitlement states, for individual providers/models, or for the cross-feature AI tutor overlay. Those remain navigation, packaging, learning ontology, source state, entitlement, dependency or delivery-overlay concepts under their canonical owners."
    - "Retain FTR-001..FTR-006 as historical/macro route anchors required by existing accepted references, but explicitly demote them from completeness units: the detailed FTR inventory becomes the material feature-completeness surface. Do not delete or repurpose the six IDs in a way that breaks prior unknown/resolution traceability."
    - "Add only the minimum new FLW identities needed to trace privileged/admin behavior that the existing FLW-001..FLW-004 cannot truthfully represent. Learner feature capabilities may reuse existing macro learner flows when truthful; do not create one flow per feature."
    - "Add grouped ACC identities sufficient for every new FTR to have at least one meaningful acceptance reference. Reuse shared acceptance where consequence is genuinely shared; do not mechanically create one ACC per FTR. Acceptance must preserve evidence authority, variant/delivery boundaries, capture limitations, entitlement/RBAC separation, Core-only privileged mutation and audit constraints."
    - "For every newly materialized FTR, resolve actor/role/flow relations truthfully in this task. For DATA, INTERFACES, external-dependency and capability relations, reuse an existing typed relation only where the accepted inventories fully cover that detailed feature. Otherwise use new OPEN DESIGN unknowns for the expanded relation domain rather than false refs or N/A. Prefer one bounded unknown per relation domain (DATA, IFC, EXT, CAP) when that accurately owns the remaining migration work; do not create one unknown per feature."
    - "Resolve UNK-005 only if the learner/admin FTR inventory, grouped flows and acceptance traceability are materially complete under current canonical design. If resolved, add dedicated docs/DECISIONS.md#UNK-005 evidence and a valid resolved_by_ref attribution."
    - "Do not attempt downstream DATA/INTERFACES/EXT/CAP expansion in this task beyond exact reuse already fully justified. Any newly created relation-domain unknowns remain explicit blockers for subsequent bounded migrations."
    - "Keep milestone.scope_state OPEN. Do not claim DOCS_READY, design lock, authority cutover, implementation readiness, standards PASS, provider activation, promotion or release."
    - "Current execution context is phone/ChatGPT+GitHub only. Do not probe Agent Runtime, local Mac, tunnel or Codex; no native execution is required by this task."
    - "Validate the exact candidate against the pinned agent-documents model. Structural/reference/feature-flow subset/reachability/orphan defects are not acceptable; intentional OPEN scope and newly explicit downstream design unknowns are acceptable."
    - "Publish one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW."

