  - id: AC-4
    requirement: "Pinned-model validation of the exact combined FROZEN candidate has zero model/reference/traceability/reachability/orphan/unresolved/blocking defects and derives DOCS_READY=TRUE."
  - id: AC-5
    requirement: "Legacy authority remains unchanged; docs/** remains authority NONE; no DESIGN LOCK, cutover, implementation-readiness or standards PASS is implied."
