structure_authority:
  status: RESOLVED
  source: "TASK-0023 GAP-002 plus accepted TASK-0013..TASK-0021 migration state and current canonical legacy owners."
  rationale: "The remaining defect is duplicated ownership of transient milestone OPEN/SCOPE_OPEN state across multiple authority-NONE migration documents. Prior repair tasks were too file-specific and therefore discovered additional coupled prose iteratively. This task authorizes one repository-wide transition-state reconciliation across the complete migrated documentation set, followed by the conditional catalog freeze in the same candidate, while preserving all product/design semantics."

objective: "Remove all current transition-coupled duplicate ownership of mutable documentation milestone state across the complete migrated docs set, independently re-run semantic closure, and freeze the milestone only when the repository-wide combined candidate is truthful and derives DOCS_READY=TRUE."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and require dev equals the exact handoff base with topology exactly {dev, main}."
    - "Independently re-run the complete semantic closure audit against current canonical CONSTITUTION.md, OBJECTIVE.md, spec/** and design/** before implementation mutation. Do not trust prior task labels as proof of closure."
    - "Search the complete migrated Markdown set docs/PRODUCT.md, docs/BEHAVIOR.md, docs/ARCHITECTURE.md, docs/DATA.md, docs/INTERFACES.md, docs/QUALITY.md, docs/DELIVERY.md and docs/DECISIONS.md for current present-tense assertions that independently own mutable milestone state, including scope remains/stays OPEN, milestone.scope_state remains OPEN, SCOPE_OPEN as a current/sole closure blocker, or equivalent not-yet-frozen statements that would become false on a truthful freeze."
    - "Distinguish current transition-coupled state from historical provenance. Past-tense descriptions of what an earlier task intentionally did or did not do may remain when still truthful; do not rewrite history merely because it mentions OPEN or an earlier blocker."
    - "If any material semantic omission, contradiction, stale assumption unrelated to the known transition-state coupling, authority drift, false N/A, unresolved product/provider/support meaning, or other genuine design blocker exists, make no implementation mutation, keep scope OPEN, publish the exact blocker and stop BLOCKED."
    - "Only if semantic closure otherwise passes, replace every current transition-coupled milestone-state assertion across the migrated Markdown set with the smallest transition-safe wording. The wording must not independently own OPEN/FROZEN state; docs/catalog/project.json remains the sole migration milestone-state authority."
    - "Preserve all product/behavior/architecture/data/interface/quality/delivery/decision semantics, all ACT/ROL/FTR/ACC/FLW/SYS/DAT/IFC/EXT/CAP/DEC identities and typed relations, UNK-001..UNK-009 RESOLVED state, provider lifecycle, exact-contract deferral, migration authority NONE, legacy authority, and the distinction among DOCS_READY, DESIGN LOCK, authority cutover, implementation readiness and release readiness."
    - "In the same bounded implementation candidate, change docs/catalog/project.json milestone.scope_state from OPEN to FROZEN. Do not publish an intermediate state where Markdown and catalog disagree."
    - "Validate the exact combined candidate against the pinned agent-documents model. Require zero model/reference/traceability/reachability/orphan/unresolved/blocking defects and derived DOCS_READY=TRUE."
    - "If combined-candidate validation fails, do not claim closure or DOCS_READY and do not broaden into redesign; stop fail-closed with exact evidence."
    - "Do not perform operator DESIGN LOCK, authority cutover, legacy retirement, standards assessment, exact machine-contract materialization, implementation planning/code, provider activation/configuration, spend authorization, staging/main mutation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery or validation probes."
    - "Publish exactly one bounded implementation commit non-force to dev only when the combined transition is justified, then one separate report-only child and stop at NEEDS_REVIEW. If blocked before implementation, publish only the truthful canonical report and stop BLOCKED."

