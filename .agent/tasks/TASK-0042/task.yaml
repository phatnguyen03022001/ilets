structure_authority:
  status: RESOLVED
  source: "TASK-0042 revision 3"
  rationale: >-
    Revision 1 proved R-F05 lacked a machine-readable canonical row. Revision 2 proved that selecting the broad
    Practice Mode registry for PM-R04 is structurally ambiguous because it contains the nested PM-R03 materializer
    anchor, so parse_table sees PM-R03 twice. Independent inspection also shows the broad official-family section
    has the same duplicate-table hazard for IELTS-R-QF-02/03. The narrow correction is to add dedicated
    materializer-anchor rows for the already-canonical R-F05, PM-R04, and IELTS-R-QF-05 identities and select
    those exact sections. This changes authority shape only, not product semantics and not materializer behavior.

