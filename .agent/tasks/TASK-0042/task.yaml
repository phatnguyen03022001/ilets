    - "Do not modify main, create branches/PRs/issues/tags/releases, change workflows, dependencies, auth, providers, DB schema/migrations, deployment, or repository metadata."
    - "Do not modify canonical PRODUCT/BEHAVIOR rows for R-F05, PM-R04, PT-13, R-QT-01, IELTS-R-QF-05, AT-02, or CTX-READING-ACADEMIC; they are already authoritative. Only planner/evidence explanatory docs may change as specified."
    - "Do not hand-edit canonical generated registry/trace, sqlc output, OpenAPI generated Go/TypeScript bindings, or formatter-owned layout."
    - "Do not perform broad refactors, framework extraction, generalized content engines, ranking systems, or iterative remote-CI debugging loops."

