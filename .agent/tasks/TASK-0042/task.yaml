objective: >-
  Close the first real fresh-sample continuation after the accepted Academic Reading classification sample. Materialize one additional owned synthetic AT-02 Matching Headings assessment revision and generalize only the existing sampled Reading path from one hard-coded classification revision/scope to content-derived canonical scope plus deterministic fresh-revision selection. After assessment-001 has already been assigned/submitted, Planner must be able to recommend and assign assessment-002 when it is current, PASS, ACTIVE, assignment-eligible, and unseen for that learner. Submission of assessment-002 may admit evidence only for its measured R-QT-01 scope and must not infer Band, readiness, mastery, weakness, or broader Reading ability. When no eligible unseen sampled revision remains, the existing FreshSampleContentGap behavior remains authoritative.

execution_routing:
  operator_environment: "phone-only; macOS unavailable; Codex available"
  primary_surface: "ChatGPT + GitHub"
  agent_runtime:
    permitted: false
  codex:
    permitted: true
    required_for:
      - "Repository-native deterministic generation for canonical registry/trace, sqlc outputs, and public OpenAPI bindings."
      - "Repository-pinned formatting plus focused Go/TypeScript/Playwright verification that cannot be executed on the phone-only primary surface."
      - "Assembling the exact atomic implementation candidate when multi-file Git-object construction cannot be truthfully reproduced through the primary surface."
    forbidden_for:
      - "Product redesign, Band/readiness policy changes, new assessment frameworks, or unrelated cleanup."
      - "Agent Runtime probing or use."
      - "Changing dependencies, workflow topology, deployment, provider architecture, or unrelated product surfaces."
    return_to_primary_surface_after_candidate: true

scope:
  required_changes:
    - "Refresh exact refs/topology/task and require dev equals the exact TASK-0042 revision-1 handoff base with topology exactly {dev, main}."
    - "Preserve the entire accepted TASK-0041 lineage and semantics. Existing reading-assessment-001 fixture identity, provenance, validation decision, learner-visible classification behavior, and admitted R-QT-02/R-QT-03 evidence semantics are immutable and must remain compatible."
    - "Add exactly one new owned synthetic bootstrap assessment fixture at services/core-api/internal/bootstrap/reading-assessment-002.json with content_id reading-bootstrap-assessment-002 and revision_id reading-bootstrap-assessment-002-r1."
    - "The new fixture must remain Academic Reading, primary_activity_purpose ASSESSMENT, evidence_candidacy ASSESSMENT_MAY_ADMIT, assessment_type_ref AT-02, content_context_id CTX-READING-ACADEMIC, feature_id R-F05, practice_mode_id PM-R04, practice_type_ids [PT-13], skill_target_ids [R-QT-01], and official_family_ids [IELTS-R-QF-05]."
    - "Use repository-owned original synthetic passage/item material only. Do not copy or closely reproduce official IELTS questions/passages. Provide at least two keyed single-selection matching-headings items compatible with the existing learner-safe material shape; hidden correct choices/explanations remain server-side until the existing reveal/evaluation path permits them."
    - "Keep validation policy version bootstrap-reading-assessment-v1 for bootstrap schema/invariant continuity. Give the new immutable validation decision its own identity and use an assessment-specific intended-use token that truthfully denotes sampled headings rather than mislabeling it as classification. Do not mutate the existing assessment-001 validation decision."
    - "Extend the seed default fixture list to include reading-assessment-002.json. Generalize seed item validation only as far as required for supported sampled Reading objective single-selection families: preserve exact T/F/NG and Y/N/NG checks for IELTS-R-QF-02/03, permit the new IELTS-R-QF-05 keyed choices, require correct_choice membership, and continue rejecting malformed/unknown canonical refs."
    - "Extend tools/canonical/source-map.json to materialize the already-canonical IDs R-F05, PM-R04, R-QT-01, and IELTS-R-QF-05 from existing canonical docs sections. Reuse PT-13 and existing AT-02/context/purpose/candidacy registries. Do not add synthetic anchor prose merely to satisfy the materializer when an existing canonical table already owns the row."
    - "Run the repository-native canonical materializer and commit every deterministic output it actually changes. At minimum this includes tools/canonical/generated/reading-training-registry.json and tools/slice/generated/reading-training-trace.json with one shared current canonical_source_revision. Do not hand-edit generated bytes."
    - "Generalize sampled AT-02 interpretation so admitted evidence scope is supplied from the exact assigned content/activity canonical target IDs rather than hard-coded R-QT-02/R-QT-03. Preserve BroaderClaimEvaluated=false and the existing admission conditions/policy. The function must defensively preserve exact measured scope and must not manufacture targets that were not on the assigned content."
    - "Generalize learner-safe assessment activity projection to derive practice_mode_id, practice_type_ids, canonical_target_ids, official_family_ids, context, and learner task material from the validated assigned content payload instead of hard-coding classification IDs. Preserve the existing direct PM-R03 training behavior."
    - "Generalize sampled assessment runtime validation only enough to accept the two bounded canonical bootstrap assessment shapes. It must still require Academic, AT-02, ASSESSMENT, ASSESSMENT_MAY_ADMIT, current PASS validation, ACTIVE operational state, assignment eligibility, canonical refs, safe learner material, and existing assistance/exposure facts."
    - "Replace planner/content-selection semantics that equate any prior sampled assignment with no fresh supply. Planner must select one current eligible sampled Reading assessment revision that has not previously been assigned to this learner, deterministically. If assessment-001 was assigned and assessment-002 remains eligible/unseen, the next DailyPlan must contain assessment-002 rather than FreshSampleContentGap."
    - "Remove the planner kernel dependency on the literal reading-bootstrap-assessment-001-r1. Model the relevant evidence input as fresh eligible sampled supply, not merely prior sampled assignment. Preserve General Training/target-unresolved behavior and preserve FreshSampleContentGap exactly when no eligible unseen sampled assessment revision exists."
    - "Generalize SQL/sqlc queries used for sampled planning, current-content recheck, prior-assignment protection, and evidence lookup so they do not pin reading-bootstrap-assessment-001-r1. Exclude revisions already assigned to the learner; do not infer actual exposure beyond stored assignment/exposure facts. Use deterministic ordering for fresh selection."
    - "Planned assignment must recheck the exact plan-item content revision against current validation/use state and reject stale/ineligible content. It must block re-assignment of the same revision while allowing a different fresh eligible sampled revision."
    - "Generalize submission/evidence recording only where required to carry the exact content-derived AT-02 target scope into the admitted EvidenceFact. Existing assessment-001 submission must still produce only R-QT-02/R-QT-03 scope; assessment-002 submission must produce only R-QT-01 scope."
    - "Update canonical planner/evidence docs only where current text says the first prior sampled assignment necessarily implies fresh-content supply blockage. New canonical wording must say FreshSampleContentGap is a product-supply condition reached when no eligible unseen sampled revision is available, not a learner weakness or evidence threshold."
    - "Extend contracts/http/public.openapi.yaml only to admit reading-bootstrap-assessment-002-r1 anywhere the exact ContentRevision ID is enumerated. Do not redesign schemas or broaden unrelated enums. Regenerate repository-native Go/TypeScript OpenAPI outputs; do not hand-edit generated bindings."
    - "Update focused planner/assessment/http integration tests first so they prove: initial plan can choose assessment-001; after assessment-001 assignment/submission and admitted scoped evidence, the next plan chooses assessment-002; assignment of assessment-002 succeeds while duplicate assignment of the same revision is blocked; assessment-002 submission records only R-QT-01; after both bounded revisions are no longer fresh, FreshSampleContentGap returns."
    - "Update the existing Playwright sampled Reading path to the new authoritative post-assessment-001 outcome: Today shows a fresh recommended assessment-002 item instead of the old content_assets blocker. Continue using stable metadata/identity assertions rather than long learner-visible copy. If the E2E continues through assessment-002, it must prove the final no-fresh-supply blocker without inventing broader learner conclusions."
    - "Use repository-native generators, gofmt, repository-pinned Prettier, focused tests, and materializer checks before publishing the candidate. Do not hand-normalize generated or formatter-owned output."
    - "Publish exactly one atomic TASK-0042 implementation candidate from the exact handoff base. The candidate may contain only the authorized semantic files, the new fixture, and deterministic generated outputs. No intermediate implementation commits may be pushed to dev."
    - "After local/Codex focused checks are green, create exactly one sentinel-only child changing only .github/verification-boundary/candidate to the implementation candidate SHA."
    - "Require exactly one new repository-native GitHub Actions verify run for revision 1. It must bind the sentinel parent as the exact candidate, checkout detached, assert exact HEAD, and PASS full ./verify including canonical materialization, formatting, generated-contract/sqlc checks, Go tests, DB seed/migrations, web tests/build, and Playwright. Do not use Actions as an iterative debugger."
    - "Only after authoritative PASS publish exactly one report-only direct child at .agent/tasks/TASK-0042/report.yaml and stop at NEEDS_REVIEW. If the single remote run fails or any required deterministic generator changes an unauthorized path, stop and return the exact blocking evidence without expanding authority."

  forbidden_changes:
    - "Do not change Band calculation, target resolution, readiness, mastery, learner-gap classification, score thresholds, evidence quantity thresholds, or any broader learner-state inference."
    - "Do not change Assessment admission conditions for independence/unseen/no-scaffolding/no-prior-feedback except to pass the exact measured canonical target scope into interpretation."
    - "Do not mutate services/core-api/internal/bootstrap/reading-assessment-001.json or historical EvidenceFacts/Attempts/PracticeActivities."
