invariants:
  - "reading-assessment-001 remains immutable and behaviorally compatible."
  - "Freshness is revision-specific: prior assignment of one sampled revision does not by itself block a different eligible unseen sampled revision."
  - "Assignment history is not automatically equivalent to actual exposure; existing exposure conditions remain the evidence source."
  - "Assessment-001 admitted evidence scope is exactly R-QT-02/R-QT-03; assessment-002 admitted evidence scope is exactly R-QT-01."
  - "Both samples remain partial Reading evidence and never establish Band, readiness, mastery, weakness, or broader Reading ability."
  - "FreshSampleContentGap remains a product/content-supply state and appears only when no eligible unseen bounded sampled revision remains."
  - "Canonical docs stay the only semantic authority; source-map/generated artifacts are derived and may not redefine canonical IDs."
  - "All generated artifacts are repository-native deterministic output."
  - "No main mutation, promotion, release, branch creation, PR creation, or repository metadata mutation."

acceptance_criteria:
  - id: AC-1
    requirement: "Second bounded sampled Reading supply is canonical and seedable."
    evidence_required: "reading-assessment-002-r1 is original synthetic Academic AT-02 content bound to R-F05/PM-R04/PT-13/R-QT-01/IELTS-R-QF-05/CTX-READING-ACADEMIC; seed validation passes and assessment-001 remains byte-for-byte unchanged."
  - id: AC-2
    requirement: "Planner selects fresh revision rather than blocking on any prior sample."
    evidence_required: "Focused kernel + DB/HTTP integration evidence shows assessment-001 first, assessment-002 after assessment-001 is already assigned/submitted, and FreshSampleContentGap only after no eligible unseen sample remains."
  - id: AC-3
    requirement: "Assignment freshness is exact-revision scoped."
    evidence_required: "Current plan-item revision is revalidated; duplicate assignment of the same revision is rejected; a different current eligible unseen revision is assignable."
  - id: AC-4
    requirement: "Evidence claim scope is content-derived and bounded."
    evidence_required: "Assessment-001 still admits only R-QT-02/R-QT-03 and assessment-002 admits only R-QT-01 with BroaderClaimEvaluated=false and no Band/readiness/mastery/weakness inference."
  - id: AC-5
    requirement: "Public and generated contracts include the new immutable revision without schema redesign."
    evidence_required: "public.openapi.yaml adds only reading-bootstrap-assessment-002-r1 where exact revision enums require it; repository-native generated Go/TypeScript outputs match generators and compile."
  - id: AC-6
    requirement: "Canonical registry/trace are current and deterministic."
    evidence_required: "source-map materializes the new already-canonical IDs and repository-native materialization reproduces registry + trace byte-for-byte with one shared canonical_source_revision."
  - id: AC-7
    requirement: "Learner-visible Today/E2E follows authoritative Core planning."
    evidence_required: "After assessment-001, Playwright observes a recommended fresh assessment-002 plan item rather than CONTENT_OR_ASSET/content_assets blocker; if the test exhausts assessment-002, the blocker reappears only after fresh supply is gone."
  - id: AC-8
    requirement: "Authoritative exact-candidate verification passes once."
    evidence_required: "One sentinel-only child binds the exact atomic TASK-0042 candidate; one new detached exact-candidate GitHub Actions run passes full ./verify."
  - id: AC-9
    requirement: "Terminal publication is report-only."
    evidence_required: "report.yaml is the only changed path in the direct child of the successful sentinel boundary."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Verify exact TASK-0042 handoff base, topology {dev, main}, task revision 1, TASK-0041 ACCEPTED lineage, and current immutable assessment-001 identity."
      required: true
    - id: CHECK-2
      command_or_check: "Write/update focused failing tests first for fresh revision selection, exact-revision duplicate protection, content-derived AT-02 scope, and post-assessment-001 Today/E2E behavior; confirm failures reproduce the current hard-coded limitations before implementation."
      required: true
    - id: CHECK-3
      command_or_check: "Implement only the bounded fixture/seed/materializer/Planner/Assessment/HTTP/contract changes authorized above."
      required: true
    - id: CHECK-4
      command_or_check: "Run repository-native canonical materialization, public OpenAPI generation, sqlc generation, gofmt, repository-pinned Prettier, focused Go tests, focused web tests, and focused Playwright where available. Require deterministic generated output and inspect the exact candidate diff before publication."
      required: true
    - id: CHECK-5
      command_or_check: "Publish one atomic implementation candidate only after focused local/Codex checks pass; prove no unauthorized path changed and assessment-001 is unchanged."
      required: true
    - id: CHECK-6
      command_or_check: "Publish one sentinel-only child and require exactly one new GitHub Actions verify run with exact candidate binding, detached exact HEAD, all generators/checks/tests/Playwright, and full ./verify PASS."
      required: true
    - id: CHECK-7
      command_or_check: "After authoritative PASS publish report-only child and stop at NEEDS_REVIEW."
      required: true
  authoritative_verification:
    required: true
    mechanism: "repository-native GitHub Actions .github/workflows/verify.yml via sentinel boundary"
    expected_signal: "exact boundary->candidate binding PASS, detached exact candidate HEAD assertion PASS, canonical materialization PASS, generated contract/sqlc checks PASS, formatter checks PASS, Go/DB/web/Playwright PASS, and full ./verify PASS"

