  - "reading-assessment-001 remains immutable and behaviorally compatible."
  - "Freshness is revision-specific: prior assignment of one sampled revision does not block a different eligible unseen revision."
  - "Assignment history is not automatically equivalent to actual exposure."
  - "Assessment-001 EvidenceFact scope is exactly R-QT-02/R-QT-03; assessment-002 scope is exactly R-QT-01."
  - "Both samples remain partial Reading evidence and never establish Band, readiness, mastery, weakness, or broader Reading ability."
  - "FreshSampleContentGap remains a product/content-supply state reached only when no eligible unseen bounded sampled revision remains."
  - "Canonical docs remain semantic authority; source-map/generated artifacts are derived and cannot redefine IDs."
  - "All generated artifacts are repository-native deterministic outputs."
  - "No main mutation, promotion, release, branch creation, PR creation, or repository metadata mutation."

acceptance_criteria:
  - id: AC-1
    requirement: "R-F05 is machine-resolvable without semantic redesign."
    evidence_required: "docs/BEHAVIOR.md adds exactly one R-F05 markdown-table row under FTR-019 that faithfully restates existing semantics; source-map selects it; repository-native materialization resolves R-F05 without materializer-code changes."
  - id: AC-2
    requirement: "Second bounded sampled Reading supply is canonical and seedable."
    evidence_required: "reading-assessment-002-r1 is original synthetic Academic AT-02 content bound to R-F05/PM-R04/PT-13/R-QT-01/IELTS-R-QF-05/CTX-READING-ACADEMIC; seed validation passes and assessment-001 remains byte-for-byte unchanged."
  - id: AC-3
    requirement: "Planner selects fresh revision rather than blocking on any prior sample."
    evidence_required: "Focused kernel + DB/HTTP integration evidence shows assessment-001 first, assessment-002 after assessment-001 is already assigned/submitted, and FreshSampleContentGap only after no eligible unseen sample remains."
  - id: AC-4
    requirement: "Assignment freshness is exact-revision scoped."
    evidence_required: "Current plan-item revision is revalidated; duplicate assignment of the same revision is rejected; a different current eligible unseen revision is assignable."
  - id: AC-5
    requirement: "Evidence claim scope is content-derived and bounded."
    evidence_required: "Assessment-001 still admits only R-QT-02/R-QT-03 and assessment-002 admits only R-QT-01 with BroaderClaimEvaluated=false and no broader learner inference."
  - id: AC-6
    requirement: "Public/generated contracts and canonical registry/trace are current and deterministic."
    evidence_required: "OpenAPI/sqlc/generated bindings reproduce from authoritative sources; canonical registry/trace materialize byte-for-byte with the same current canonical_source_revision."
  - id: AC-7
    requirement: "Learner-visible Today/E2E follows authoritative fresh Core planning."
    evidence_required: "After assessment-001, Playwright observes Recommended next for assessment-002 instead of the content_assets blocker; blocker returns only after fresh bounded supply is exhausted."
  - id: AC-8
    requirement: "Authoritative exact-candidate verification passes once."
    evidence_required: "One sentinel-only child binds the exact atomic revision-2 candidate and one new detached exact-candidate GitHub Actions run passes full ./verify."
  - id: AC-9
    requirement: "Terminal publication is canonical report-only."
    evidence_required: "report.yaml instantiates the pinned canonical report template and is the only changed path in the direct child of the successful sentinel boundary."

