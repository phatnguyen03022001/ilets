structure_authority:
  status: RESOLVED
  source: "agent-documents V1 BEHAVIOR/project catalog model at acb3f02616e700190586681306a86905792e4c07 plus current canonical IELTS behavior owners."
  rationale: "TASK-0002 proved the intended BEHAVIOR + catalog slice was correct but blocked only by the missing unresolved feature-relation state. TASK-0004 corrected exactly that model defect, so the same target slice can now continue without false N/A or premature neighboring-domain identities."

objective: "Materialize the first coherent IELTS BEHAVIOR migration draft and initial project catalog using the corrected agent-documents V1 relation model, while preserving legacy canonical authority and explicitly representing not-yet-migrated material relations with OPEN DESIGN UNK records plus unresolved_ref."

scope:
  required_changes:
    - "Create docs/BEHAVIOR.md as MIGRATION DRAFT / AUTHORITY NONE. Map only existing observable IELTS behavior from current canonical OBJECTIVE/spec/design sources."
    - "Create docs/catalog/project.json with model_version 1, milestone.scope_state OPEN, scope_ref docs/PRODUCT.md#Scope, and stable target-owned ACT/ROL/FTR/ACC/FLW identities for this behavior slice."
    - "Populate only identities directly supported by migrated truth. Do not create SYS/DAT/IFC/EXT/CAP identities merely for completeness."
    - "For a material feature relation whose typed target domain is not yet migrated, create a bounded OPEN DESIGN UNK record and use exactly {\"unresolved_ref\": \"UNK-...\"}. Use {\"na\": ...} only for genuine demonstrated non-applicability."
    - "Ensure every FTR/ACC/FLW used in BEHAVIOR exists exactly once in the catalog and every catalog behavior reference resolves to the intended BEHAVIOR heading."
    - "Set coverage conservatively: only supported product/behavior concerns may exceed NONE; unmigrated concerns remain NONE unless direct target evidence proves otherwise. Coverage depth is not maturity."
    - "Update docs/DECISIONS.md only if needed to pin the accepted agent-documents revision and preserve the migration authority boundary. Leave docs/PRODUCT.md unchanged unless a purely structural reference-token correction is strictly required."
    - "Validate the candidate against the exact agent-documents V1 schema/validator semantics at acb3f02616e700190586681306a86905792e4c07 using an actually exposed isolated test surface when available; otherwise perform deterministic schema/cross-reference inspection and report the capability boundary truthfully."
    - "Do not modify legacy canonical docs, code, workflows, runtime behavior, main, or any external repository."
    - "Do not claim DOCS_READY, documentation/design lock, implementation readiness, standards PASS/level/N/A/exception, generated PROGRAM, promotion, or release readiness."
    - "Publish one bounded implementation commit non-force to dev, then a separate report-only child and stop at NEEDS_REVIEW."

  allowed_existing_files_or_components:
    - docs/PRODUCT.md
    - docs/DECISIONS.md
    - .agent/tasks/TASK-0003/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "CONSTITUTION.md, OBJECTIVE.md, spec/**, and design/** remain canonical throughout this slice."
  - "docs/PRODUCT.md, docs/DECISIONS.md, docs/BEHAVIOR.md, and docs/catalog/project.json remain migration artifacts with authority NONE until explicit cutover."
  - "Catalog owns migration identities/relations; BEHAVIOR owns migrated behavior explanation."
  - "No false N/A and no premature neighboring-domain identity materialization."
  - "Every unresolved_ref targets an existing OPEN DESIGN UNK and remains a documentation-closure blocker."
  - "model_version remains 1; agent-documents remains an unreleased candidate."
  - "Branches remain exactly {dev, main}; main remains e707aeee43411cc8f99448b63220eb8beff552b6."

forbidden_changes:
  - "Do not modify README.md, CONSTITUTION.md, OBJECTIVE.md, spec/**, design/**, contracts/**, apps/**, services/**, tools/**, .github/**, verify, compose files, research/**, evidence/**, or main."
  - "Do not create docs/ARCHITECTURE.md, docs/DATA.md, docs/INTERFACES.md, docs/QUALITY.md, docs/DELIVERY.md, assurance registries, generated programs, provider registries, or orchestration state."
  - "Do not delete, rename, or demote legacy canonical documents."
  - "Do not copy the full agent-documents schema/model or agent-standards catalog into IELTS."
  - "Do not create branch, PR, tag, release, or repository metadata mutation."

