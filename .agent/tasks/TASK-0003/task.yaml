  - id: AC-1
    requirement: "Migration preserves one canonical target authority."
    evidence_required: "BEHAVIOR/catalog are authority NONE and legacy canonical owners remain unchanged."
  - id: AC-2
    requirement: "Behavior identity ownership and traceability are coherent."
    evidence_required: "FTR/ACC/FLW identities are catalog-owned, BEHAVIOR explanations resolve correctly, and current target semantics are preserved without invention."
  - id: AC-3
    requirement: "Not-yet-migrated material relations are represented truthfully."
    evidence_required: "Applicable unresolved relations use unresolved_ref -> existing OPEN DESIGN UNK; genuine na remains distinct; no premature DAT/IFC/EXT/CAP identities are invented."
  - id: AC-4
    requirement: "Catalog remains conservative and V1-valid without false closure."
    evidence_required: "model_version=1, milestone OPEN, required shape/references valid, coverage claims bounded, unresolved relations closure-blocking, and no DOCS_READY claim."
  - id: AC-5
    requirement: "Execution remains bounded and lineage-exact."
    evidence_required: "Implementation is one direct child of exact handoff base with only authorized migration paths; report is a separate report-only child; main unchanged and topology exactly {dev, main}."

