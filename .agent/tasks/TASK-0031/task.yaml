    - "After successful cutover verify one unambiguous authority path, unchanged locked semantics, FROZEN milestone, zero pinned agent-documents model/reference/coverage/traceability/reachability/orphan/unresolved/blocking defects and derived DOCS_READY=TRUE."
    - "Preserve every accepted ACT/ROL/FTR/ACC/SYS/DAT/IFC/FLW/EXT/CAP/DEC/UNK identity/relation, all Skill/Knowledge/Curriculum/practice/assessment/progression/content/provider/coverage semantics, and exact contracts outside their scoped authority."
