    - "If and only if the fresh complete audit proves zero material residuals, include the canonical authority cutover in the same bounded implementation candidate: make the eight docs authority domains, legal referenced shards and docs/catalog/project.json canonical project-documentation authority; preserve distinct CONSTITUTION.md and OBJECTIVE.md authority; preserve scoped exact machine-contract authority in contracts/**; update README/read-order precedence; remove false MIGRATION DRAFT / AUTHORITY NONE / NON-CUTOVER wording from canonical successor roots/shards; minimally demote active canonical claims in legacy spec/** and design/** so no equal dual authority remains."
