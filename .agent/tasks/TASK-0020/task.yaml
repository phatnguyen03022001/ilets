    - "If any material gap remains, keep milestone.scope_state OPEN, do not patch neighboring product design in this task, report the exact blocker, and stop BLOCKED without claiming DOCS_READY."
    - "Only if semantic audit passes, change docs/catalog/project.json milestone.scope_state from OPEN to FROZEN and make no unrelated semantic edits."
    - "Validate the exact frozen candidate against the pinned agent-documents model; require zero model/reference/traceability/reachability/orphan/unresolved/blocking defects and derived DOCS_READY=TRUE."
    - "Do not perform operator DESIGN LOCK, authority cutover, legacy retirement, standards assessment, exact machine-contract materialization, implementation planning/code, provider activation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "Publish at most one bounded implementation commit non-force to dev if freeze is justified, then one separate report-only child and stop at NEEDS_REVIEW. If blocked before implementation, publish only the truthful canonical report and stop BLOCKED."

