objective: >-
  Reconcile the highest-level repository governance text with the already accepted docs-only authority cutover, remove stale constitutional claims that spec/** or design/** remain canonical, and resolve any unique terminology semantics still stranded in spec/11-GLOSSARY.md into the smallest correct existing docs owner(s) without creating a glossary framework or changing product meaning.

scope:
  required_changes:
    - "Refresh refs/topology/task and require dev equals the exact handoff base with topology exactly {dev, main}."
    - "Treat TASK-0031 ACCEPTED cutover as the already-authorized semantic direction; this task repairs contradictory authority representation and does not reopen that decision."
    - "Audit CONSTITUTION.md for every stale pre-cutover authority statement, including hierarchy, active authority surface, canonical metadata rules, learning/design planes, evidence ownership, domain ownership, change rules, implementation-stack ownership, cross-language ownership, and terminology/glossary references. Do not patch only the first occurrence."
    - "Rewrite only the minimum constitutional text necessary so the authority path is internally coherent: USER -> CONSTITUTION.md -> OBJECTIVE.md -> canonical docs/** owners/legal catalog-referenced shards/catalog, with contracts/** owning exact machine interface truth only inside scoped boundaries."
    - "State clearly that spec/** and design/** are superseded/non-canonical legacy material and cannot own current semantics; research/** and evidence/** remain non-canonical provenance material; Git history remains the default home for superseded history."
    - "Preserve the existing eight docs authority domains: PRODUCT, BEHAVIOR, ARCHITECTURE, DATA, INTERFACES, QUALITY, DELIVERY, DECISIONS. Do not create a ninth authority domain or a glossary framework."
    - "Inspect spec/11-GLOSSARY.md against the current canonical docs plane. If every term is already materially owned by existing docs, remove constitutional dependence on the legacy glossary and make no duplicate copy. If any unique current terminology semantic exists, move only that exact semantic into the smallest correct existing docs owner(s), preserving meaning and stable vocabulary without introducing a new glossary file/domain."
    - "Do not delete spec/** or design/** in this task. Repository subtraction remains a later task after this authority contradiction is repaired and reviewed."
    - "Do not alter product behavior, IELTS learning truth, Band thresholds, planner/progression semantics, provider policy, runtime behavior, API/schema semantics, standards claims, feature scope, or DESIGN LOCK meaning."
    - "Do not modify OBJECTIVE.md unless exact inspection proves it contains a directly contradictory stale authority statement. If changed, the edit must be authority-representation-only and semantics-preserving."
    - "README.md should remain unchanged unless exact inspection proves a contradiction with the repaired Constitution; do not rewrite navigation merely for style."
    - "Before publication, inspect the complete diff and prove every change is authority-representation/terminology-ownership reconciliation only, with no new semantic requirement."
    - "Publish exactly one implementation commit, then exactly one canonical report-only child. No sentinel boundary or GitHub Actions run is required for this docs/governance-only correction."
    - "If resolving the glossary would require choosing between materially different semantic meanings or inventing a new owner/domain, fail closed: make no semantic implementation mutation, publish a truthful BLOCKED report, and stop."

