structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "No new material ownership, component, public/shared contract, or cross-component structure is authorized. Executor may choose local internal structure inside the existing Listening training component under the pinned protocol."

objective: >-
  Materialize one real executable PM-L02 Gist Sprint TRAINING activity inside the existing Listening Core/API practice route, using the already-canonical PM-L02 -> PT-12 and FTR-009 meaning, so a learner can perform bounded main-idea/discourse listening practice without creating Assessment evidence or changing existing public/data/ownership boundaries.

scope:
  required_changes:
    - "Make one PM-L02 Gist Sprint activity executable through the existing authenticated learner practice route for both current IELTS variants where Listening is shared."
    - "Preserve PM-L02 as main-idea/discourse practice backed by PT-12 and FTR-009; do not reinterpret it as detail/completion, diagnostic, assessment, or readiness work."
    - "Use existing eligible Listening content/media and existing learner ownership/public activity semantics; no new media/provider/storage/public-API contract is authorized."
    - "TRAINING completion may create the normal Attempt/Observation consequence only; it creates zero EvidenceFact and no Band/readiness/mastery/weakness, GapEvaluation, Progression, or Planner consequence."
    - "Preserve the accepted PM-L03 Listening slice and existing Reading behavior."
    - "Executor resolves local files, internal helpers/modules, materialization mechanics, test companions, and repository-native verification from current repository patterns."
  allowed_existing_files_or_components:
    - "existing Listening Core/API training component"
    - "canonical practice/materialization ownership surfaces"
    - "existing learner activity/media contract implementation"
    - "repository-native verification companions"

invariants:
  - "PM-L02 remains the canonical Gist Sprint identity and PT-12 remains its canonical backing."
  - "Listening remains shared across Academic and General Training; no synthetic SHARED TestVariant is introduced."
  - "TRAINING is not Assessment evidence."
  - "Existing public API, learner ownership, persistence model, provider/storage boundaries, and cross-component ownership do not change."
  - "Executor discretion may change local HOW but not these material consequences."

forbidden_changes:
  - "Do not add or change public API semantics, persistence schema/meaning, authentication/authorization ownership, media/provider/storage architecture, Assessment/Evidence admission, Progression/Planner semantics, or cross-component ownership."
  - "Do not redesign PM-L02, PT-12, FTR-009, PM-L03, Reading, TargetProfile, or the practice catalog."
  - "Do not modify main, create staging, add dependencies without material authority, or mutate agent-* repositories or architect-profile."

