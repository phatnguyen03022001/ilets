  - id: AC-2
    requirement: "The activity stays inside existing learner/public/data boundaries."
    evidence_required: "Academic and General Training learners can use the bounded activity through existing authenticated ownership/activity semantics, with eligible Listening content and no new public contract, persistence meaning, provider/storage boundary, or cross-component owner."
  - id: AC-3
    requirement: "TRAINING consequence remains observation-only."
    evidence_required: "Completion records the authorized Attempt/Observation scope and creates zero EvidenceFact plus no Assessment, Progression, GapEvaluation, Band/readiness/mastery/weakness, or Planner consequence."
  - id: AC-4
    requirement: "Existing Listening and Reading behavior regressions remain intact while local implementation HOW stays Executor-owned."
    evidence_required: "Repository-native tests prove PM-L03 and existing Reading behavior remain unchanged; any necessary local companion surfaces are reported rather than treated as automatic revision triggers."
