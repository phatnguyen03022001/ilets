    max: 0
  allow_new_top_level_directories: false

invariants:
  - "Legacy canonical owners remain unchanged; docs/* remain authority NONE until explicit cutover."
  - "model_version remains 1; milestone.scope_state remains OPEN."
  - "No existing entity inventory, typed relation or UNK semantic state changes; only authorized delivery coverage changes."
  - "No EXT/CAP/DEC/provider inventory, provider activation, exact deployment implementation or external dependency closure."
  - "No standards PASS/level, DOCS_READY, design lock, implementation readiness, promotion or release claim."
  - "main remains e707aeee43411cc8f99448b63220eb8beff552b6 and topology remains exactly {dev, main}."

forbidden_changes:
  - "No legacy docs, PRODUCT/BEHAVIOR/ARCHITECTURE/DATA/INTERFACES/QUALITY/DECISIONS prose mutation, code, contracts, workflows, tools, migrations, provider inventory, deployment config, main or external repository mutation."

acceptance_criteria:
  - id: AC-1
    requirement: "DELIVERY migration preserves authority boundaries and does not duplicate neighboring domain truth."
  - id: AC-2
    requirement: "All five delivery concerns receive truthful design-sufficient L1 treatment with no invented deployment/provider/SLO details."
  - id: AC-3
    requirement: "Deployment, rollback, restore, compatibility and operational ownership preserve current Web/Core/Evaluator, persistence, data-lifecycle, interface and quality invariants."
  - id: AC-4
    requirement: "Catalog remains structurally valid and intentionally incomplete, with zero model/reference/traceability/orphan defects and unchanged UNK-003/UNK-004 relations."
  - id: AC-5
    requirement: "Implementation is one exact-base child changing only docs/DELIVERY.md + docs/catalog/project.json; report is a separate report-only child; main/topology unchanged."

