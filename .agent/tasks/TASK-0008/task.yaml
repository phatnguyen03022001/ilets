structure_authority:
  status: RESOLVED
  source: "agent-documents DELIVERY template/model plus canonical IELTS design/06-implementation-stack.md, design/07-third-party-services.md, current architecture/data/interfaces/quality migration drafts for cross-reference, and existing repository verification/deployment constraints where directly relevant."
  rationale: "Current canonical design already fixes environment/configuration separation, deployment/release and rollback invariants, persistence migration/restore boundaries, compatibility/version-skew requirements, and operational ownership responsibilities. This slice migrates those DELIVERY properties only; external dependency inventory, build/buy capability decisions, provider activation and exact deployment configuration remain separate unresolved work."

objective: "Create the non-authoritative DELIVERY migration draft and advance only the five V1 delivery coverage concerns to design-sufficient treatment already supported by current canonical target truth, without materializing external dependency/capability/decision inventory or deployment implementation."

scope:
  required_changes:
    - "Create docs/DELIVERY.md as MIGRATION DRAFT / AUTHORITY NONE. Migrate only current canonical treatment for environments/configuration; deployment/migration/rollback; backup/restore; compatibility/versioning/platform constraints; and operational ownership."
    - "Preserve environment-specific configuration as deployment/bootstrap input rather than product/domain authority. Secrets remain under QUALITY/security ownership; typed runtime policy remains distinct from secret custody and provider control-plane state."
    - "Preserve the three logical runtime units and their trust/persistence boundaries across deployment or co-location. Deployment topology may change only without moving Web/Core/Evaluator semantic authority or Core-only authoritative application persistence."
    - "Preserve ordered/versioned schema migration, application/schema compatibility, bounded rollout/rollback and accepted-work recovery semantics without inventing DDL, migration commands, provider products, exact rollout percentages, RPO/RTO or universal SLO constants."
    - "Preserve backup/restore as recovery evidence for authoritative product state, including deletion/tombstone reconciliation and credible provider-exit restore where current canonical design requires it. Do not create a second live database, automatic multi-cloud failover or provider-specific backup implementation."
    - "Preserve machine-contract and generated-artifact compatibility/version-skew rules already owned by INTERFACES/architecture. Deployment cannot silently place incompatible producer/consumer/schema revisions into a supported skew direction."
    - "Describe operational ownership for runtime health, incidents, config/release provenance, rollback/recovery, cost/capacity observations and provider degradation at the current design level only. Operational telemetry/control-plane state remains evidence/operations state, not product truth."
    - "Advance only delivery.environments_config, delivery.deployment_migration_rollback, delivery.backup_restore, delivery.compatibility_versioning_platforms and delivery.operational_ownership to L1 when backed by non-empty DELIVERY sections."
    - "Keep architecture.build_buy, interfaces.external_dependencies, interfaces.dependency_failure_exit, decisions.material_choices, unknowns.open_questions, UNK-003 and UNK-004 unchanged. Do not create EXT/CAP/DEC identities or provider inventory."
    - "Do not create deployment manifests, Terraform, Docker/Kubernetes configuration, GitHub Actions, secrets, provider configuration, exact environment files, release scripts, migrations, contracts, code or other implementation artifacts."
    - "Validate exact candidate catalog/reference/coverage/closure semantics against agent-documents@acb3f02616e700190586681306a86905792e4c07. Model/reference/traceability/orphan errors are not acceptable; unfinished migration blockers are."
    - "Publish one bounded implementation commit non-force to dev, then a separate report-only child and stop at NEEDS_REVIEW."

structure_policy:
  expected_new_files:
    - docs/DELIVERY.md
    - .agent/tasks/TASK-0008/report.yaml
  allowed_existing_files:
