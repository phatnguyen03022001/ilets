structure_authority:
  status: RESOLVED
  source: "agent-documents ARCHITECTURE/CAP/DEC model plus canonical IELTS design/06-implementation-stack.md, design/07-third-party-services.md and the accepted SYS/EXT migration state."
  rationale: "Canonical design already separates custom product semantics from commodity engineering/external capability routes, fixes Web/Core/Evaluator ownership, selects initial external routes behind replaceable boundaries, and defines reuse-first plus portability/exit rules. This slice migrates those existing build/buy consequences only; it does not select or activate providers or freeze scope."

objective: "Complete the bounded capability/build-buy and material-decision migration for the accepted behavior slice by materializing the smallest justified CAP/DEC inventory, resolving feature capability relations and UNK-004 only where current canonical truth fully supports them, and closing the remaining build-buy/decision/unknown coverage without claiming milestone closure."

scope:
  required_changes:
    - "Extend docs/ARCHITECTURE.md with design-sufficient CAP-* capability boundary/build-buy/exit treatment already supported by canonical design. Keep it MIGRATION DRAFT / AUTHORITY NONE."
    - "Materialize only material CAP-* boundaries that genuinely explain implementation-driving build/buy ownership for the current migrated behavior slice. Do not create one CAP per vendor, library, endpoint, model alias, framework or minor implementation concern."
    - "Use V1 dispositions truthfully: BUILD only for a capability resolved to project systems; BUY only for a capability resolved to external dependencies; HYBRID only when project-owned system responsibility and an external dependency jointly implement the capability boundary; DEFER only for a genuine current-milestone capability decision that is intentionally deferred and not feature-referenced."
    - "Prefer existing canonical product/domain semantics as BUILD inside their current SYS owners and commodity/external execution behind the existing EXT boundaries where current canonical design establishes that split. Do not collapse product authority into a provider merely to make a BUY disposition simple."
    - "Every resolved non-DEFER CAP must have the required SYS/EXT references for its disposition, one material DEC-* attribution, a non-empty ARCHITECTURE boundary_ref and truthful exit treatment under the pinned V1 model."
    - "Materialize the minimum DEC-* records needed to explain current material build/buy choices. A decision may support more than one CAP only when it is genuinely one architectural choice; do not mechanically create one DEC per CAP or combine unrelated choices into one mega-decision."
    - "For each material DEC-* add design-sufficient docs/DECISIONS.md explanation covering context, selected outcome, rejected/alternative direction where material, rationale, consequences and reversibility without duplicating mutable provider pricing/benchmark/quota research."
    - "Map FTR.capabilities only where the CAP inventory fully and truthfully covers the material capability relation for that feature. Resolve UNK-004 only if all six affected feature capability relations are typed without false N/A or speculative CAP identities. If resolved, add dedicated docs/DECISIONS.md#UNK-004 evidence and valid resolved_by_ref attribution."
    - "Advance architecture.build_buy and decisions.material_choices to L1 when supported by non-empty ARCHITECTURE/DECISIONS sections. Advance unknowns.open_questions to L1 only if the migration set truthfully documents the unknown inventory/resolutions and no required open design relation is hidden."
    - "Preserve provider lifecycle truth: SELECTED_FOR_IMPLEMENTATION is not ACTIVE; pronunciation/acoustic provider state remains TBD where canonical design says so; provider selection/activation, pricing, calibration evidence and runtime configuration are not changed by CAP/DEC migration."
    - "Preserve the accepted EXT-001..EXT-004 inventory and existing SYS/DAT/IFC identities unless a model-valid relation update requires references only. Do not create new EXT identities in this task."
    - "Keep milestone.scope_state OPEN. Do not claim DOCS_READY, design lock, cutover, implementation readiness, standards PASS, promotion or release even if all coverage gaps and unresolved relations reach zero. Scope freeze/closure is a later explicit Architect-controlled step."
    - "Validate exact candidate CAP disposition requirements, DEC references, feature-capability typing, global refs, reachability/orphan semantics, unknown resolution and coverage/closure accounting against agent-documents@acb3f02616e700190586681306a86905792e4c07. Structural/reference/traceability/orphan defects are not acceptable; SCOPE_OPEN is expected to remain."
    - "Publish one bounded implementation commit non-force to dev, then a separate report-only child and stop at NEEDS_REVIEW."

