  - "model_version remains 1 and milestone.scope_state remains OPEN."
  - "Existing ACT/ROL/FTR/ACC/SYS/DAT/IFC/FLW/EXT identities remain unchanged except authorized capability/decision references."
  - "No new provider route, provider activation, exact contract, code, deployment/configuration, pricing constant or assurance claim."
  - "UNK-001..UNK-003 remain RESOLVED; UNK-004 changes only if this exact task fully resolves its affected feature capability relations."
  - "main remains e707aeee43411cc8f99448b63220eb8beff552b6 and topology remains exactly {dev, main}."

forbidden_changes:
