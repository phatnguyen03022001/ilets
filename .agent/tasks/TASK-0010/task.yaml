  - id: AC-3
    requirement: "Feature capability relations and UNK-004 resolve only to the extent fully supported, with no false N/A or speculative capability identities."
  - id: AC-4
    requirement: "architecture.build_buy, decisions.material_choices and, when justified, unknowns.open_questions reach L1 while milestone scope remains OPEN and no DOCS_READY/cutover claim is made."
  - id: AC-5
    requirement: "Catalog remains structurally valid with zero model/reference/traceability/orphan defects; implementation is one exact-base child changing only docs/ARCHITECTURE.md, docs/DECISIONS.md and docs/catalog/project.json; report is a separate report-only child; main/topology unchanged."

