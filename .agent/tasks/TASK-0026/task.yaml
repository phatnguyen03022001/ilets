structure_authority:
  status: RESOLVED
  source: "TASK-0024/TASK-0025 accepted closure plus two targeted Red Team PASS results and explicit operator DESIGN LOCK."
  rationale: "The next lifecycle transition is authority cutover, not further product redesign. The task must fail closed if the repository cannot make docs/** canonical without losing unique legacy truth or creating contradictory dual authority. Legacy retirement/deletion is intentionally a later task."

objective: "Perform one bounded canonical authority cutover from the locked legacy-owned design state to the FROZEN successor docs/** set, preserving all unique material truth and leaving legacy files present as non-authoritative references for a later retirement audit."

scope:
  required_changes:
    - "Refresh exact refs/topology/task/pins and require dev equals the exact handoff base with topology exactly {dev, main}."
    - "Verify operator DESIGN LOCK is bound to exact snapshot 66628c089611d43dc929fa7b437666a7830588c4 and that no product/design semantic mutation occurred after that snapshot other than this task artifact. If semantic drift exists, stop BLOCKED."
    - "Independently audit current authority declarations and read-order surfaces before mutation: README.md, CONSTITUTION.md, OBJECTIVE.md, all docs/** authority headers/boundaries, all spec/** STATUS/OWNS headers, all design/** STATUS/OWNS headers, and any catalog fields that materially participate in authority interpretation."
    - "Prove that promoting docs/** to canonical authority does not discard material unique truth required by the locked design. If any material truth still exists only in legacy and would become non-authoritative or ambiguous after cutover, make no cutover mutation, report the exact gap and stop BLOCKED."
    - "Only if the audit passes, make the smallest coherent repository-wide authority transition so docs/PRODUCT.md, docs/BEHAVIOR.md, docs/ARCHITECTURE.md, docs/DATA.md, docs/INTERFACES.md, docs/QUALITY.md, docs/DELIVERY.md, docs/DECISIONS.md and docs/catalog/project.json become the canonical project documentation authority set."
    - "Update README/read-order/precedence wording only as required to make the new authority unambiguous."
    - "Remove or replace MIGRATION DRAFT / AUTHORITY NONE statements from the successor docs only where required by cutover. Preserve their product/system semantics and provenance."
    - "Demote legacy spec/** and design/** from canonical authority to clearly non-authoritative legacy/reference status only as required to prevent dual authority. Keep the files present; do not delete, archive, rename, relocate, or broadly rewrite them in this task."
    - "Treat CONSTITUTION.md and OBJECTIVE.md conservatively. Do not delete or demote either unless the cutover audit proves their authority is fully and explicitly superseded without loss. Prefer preserving any still-distinct operator/product constitutional authority above the canonical docs set."
    - "Do not alter product semantics, actor/role/feature/data/interface/capability/provider meanings, exact contract content, quality requirements, delivery requirements, or decision substance merely to perform cutover."
    - "After mutation, independently verify there is exactly one coherent canonical authority path and no contradictory statement still claims legacy spec/design and successor docs are simultaneously canonical for the same truth."
    - "Re-run pinned documentation-model/reference/traceability/reachability/unknown validation where applicable and require the successor set to remain structurally valid and semantically FROZEN."
    - "Do not perform legacy deletion/retirement cleanup beyond authority demotion, standards applicability/assessment, exact machine-contract materialization, implementation planning/code, provider activation/configuration, spend authorization, staging/main mutation, promotion or release."
    - "Use GitHub-native surfaces only; do not probe Agent Runtime, local Mac, tunnel or Codex. Mutation APIs are not discovery/validation probes."
    - "Publish at most one bounded implementation commit non-force to dev, then one separate report-only child and stop at NEEDS_REVIEW. If blocked before implementation, publish only the truthful canonical report and stop BLOCKED."

