services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ilets
      POSTGRES_USER: ilets
      POSTGRES_PASSWORD: ilets
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilets -d ilets"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
