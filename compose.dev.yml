services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ilets
      POSTGRES_USER: ilets
      POSTGRES_PASSWORD: ilets
    ports:
      - "127.0.0.1:${ILETS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilets -d ilets"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:8.2.9-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${ILETS_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /data
