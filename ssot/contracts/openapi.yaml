openapi: 3.0.3
info:
  title: IELTS Platform API
  description: Comprehensive API specification for the IELTS learning platform
  version: 1.0.0
  contact:
    name: IELTS Platform Team
    email: support@ielts-platform.com

servers:
  - url: https://api.ielts-platform.com/v1
    description: Production server
  - url: https://staging-api.ielts-platform.com/v1
    description: Staging server

paths:
  # Identity Service Endpoints
  /identity/register:
    post:
      tags: [Identity]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                name:
                  type: string
                username:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid input
        '409':
          description: User already exists

  /identity/login:
    post:
      tags: [Identity]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /identity/profile:
    get:
      tags: [Identity]
      summary: Get user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
    put:
      tags: [Identity]
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                preferences:
                  type: object
      responses:
        '200':
          description: Profile updated

  # Learning Service Endpoints
  /learning/assessments:
    get:
      tags: [Learning]
      summary: List assessments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of assessments
    post:
      tags: [Learning]
      summary: Create assessment
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                title:
                  type: string
                type:
                  type: string
                  enum: [writing, speaking, reading, listening]
                content:
                  type: object
                duration:
                  type: integer
                metadata:
                  type: object
      responses:
        '201':
          description: Assessment created

  /learning/submissions:
    post:
      tags: [Learning]
      summary: Submit assessment
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [assessment_id, content]
              properties:
                assessment_id:
                  type: string
                content:
                  type: object
                time_spent:
                  type: integer
                metadata:
                  type: object
      responses:
        '201':
          description: Submission created

  # Payment Service Endpoints
  /payments/process:
    post:
      tags: [Payment]
      summary: Process payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, payment_method]
              properties:
                amount:
                  type: number
                  format: float
                currency:
                  type: string
                payment_method:
                  type: string
                description:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Payment processed
        '400':
          description: Invalid payment details
        '402':
          description: Payment failed

  # Analytics Service Endpoints
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Get analytics overview
      security:
        - bearerAuth: []
      parameters:
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [day, week, month]
      responses:
        '200':
          description: Analytics data retrieved

  # Admin Service Endpoints
  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: User list retrieved
    post:
      tags: [Admin]
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                role:
                  type: string
                  enum: [admin, user, moderator]
      responses:
        '201':
          description: User created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user, moderator]
        status:
          type: string
          enum: [active, inactive, suspended]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: object

    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
          enum: [writing, speaking, reading, listening]
        description:
          type: string
        duration:
          type: integer
        created_at:
          type: string
          format: date-time
        metadata:
          type: object

    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assessment_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: object
        score:
          type: number
        feedback:
          type: object
        created_at:
          type: string
          format: date-time
        metadata:
          type: object

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        created_at:
          type: string
          format: date-time
        metadata:
          type: object

tags:
  - name: Identity
    description: User authentication and management
  - name: Learning
    description: Learning assessments and submissions
  - name: Payment
    description: Payment processing and billing
  - name: Analytics
    description: Analytics and reporting
  - name: Admin
    description: Administrative functions