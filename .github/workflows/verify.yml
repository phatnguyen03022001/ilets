name: verify

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/verification-boundary/candidate'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

concurrency:
  group: verify-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verification ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact candidate from latest sentinel boundary
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sentinel=.github/verification-boundary/candidate

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          boundary="$(git log -n 1 --format=%H -- "$sentinel")"
          test -n "$boundary"

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$boundary")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$sentinel"

          candidate_file="$RUNNER_TEMP/verification-candidate"
          git show "${boundary}:${sentinel}" > "$candidate_file"
          test "$(wc -l < "$candidate_file")" -eq 1
          candidate="$(cat "$candidate_file")"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid candidate SHA" >&2
            exit 1
          fi
          printf '%s\n' "$candidate" | cmp -s - "$candidate_file"

          git cat-file -e "${candidate}^{commit}"
          parent="$(git rev-parse "${boundary}^")"
          test "$candidate" = "$parent"

          echo "boundary=$boundary" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          printf 'Verified boundary %s -> exact candidate %s\n' "$boundary" "$candidate"

      - name: Checkout exact candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: git checkout --detach "$CANDIDATE_SHA"

      - name: Assert exact candidate HEAD
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: chmod +x verify tools/contracts/validate.sh tools/contracts/generate.sh tools/db/generate.sh tools/db/migrate.sh
      - run: ./verify
