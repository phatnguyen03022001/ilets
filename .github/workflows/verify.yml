name: verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.label.name == 'ci-candidate' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'dev' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.login == github.repository_owner
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind verification target
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: chmod +x verify tools/contracts/validate.sh tools/contracts/generate.sh tools/db/generate.sh tools/db/migrate.sh
      - run: ./verify
