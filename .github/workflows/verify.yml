name: verify

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: chmod +x verify tools/contracts/generate.sh tools/db/generate.sh tools/db/migrate.sh
      - run: ./verify
