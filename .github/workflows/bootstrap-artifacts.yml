name: bootstrap-artifacts-readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - contracts/http/public-v1.json
      - apps/web/package.json
      - services/core-api/go.mod
      - tools/contracts/generate.sh
      - .github/workflows/bootstrap-artifacts.yml

permissions:
  contents: read
  statuses: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - name: Resolve locked web graph locally
        working-directory: apps/web
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Generate contract bindings using repository-local command
        run: ./tools/contracts/generate.sh
      - name: Resolve Go module graph locally
        working-directory: services/core-api
        run: go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-generated-readonly
          if-no-files-found: error
          path: |
            apps/web/pnpm-lock.yaml
            apps/web/src/generated/public-v1.ts
            services/core-api/go.mod
            services/core-api/go.sum
            services/core-api/internal/httpapi/generated/public_v1.gen.go
      - name: Publish generation status locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status }}
        run: |
          case "$STATE" in
            success) STATE=success ;;
            cancelled) STATE=error ;;
            *) STATE=failure ;;
          esac
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"bootstrap/generate\",\"description\":\"local generator executed on hosted runner\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
